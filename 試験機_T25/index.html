<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>遊創舎 2.5D筐体試験機</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cabinet.css">
<link rel="stylesheet" href="css/reels.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="page">
  <div class="wrap">

    <div id="machine" class="machine">
      <canvas id="fxCanvas"></canvas>

      <div class="side-led left"></div>
      <div class="side-led right"></div>

      <div class="top-led"></div>

      <section class="panel title-panel">
        <div class="brand">🌱 遊創舎</div>
        <h1 class="title">⚡ 2.5D 試験機 ⚡</h1>
        <div class="version">YUSOSHA SLOT Ver.T25-0.2</div>
      </section>

      <section class="panel reel-panel">
        <div class="reel-row">

          <div class="lamp-frame">
            <div id="lamp" class="lamp">PEKA</div>
          </div>

          <div class="reel-window">
            <div class="reels">

              <div id="reel0" class="reel">
                <div class="reel-strip">
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                </div>
              </div>

              <div id="reel1" class="reel">
                <div class="reel-strip">
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                </div>
              </div>

              <div id="reel2" class="reel">
                <div class="reel-strip">
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol replay">🌀</div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <div id="message" class="message">BETしてください</div>
      </section>
      
<!-- =======================================================
     情報・BET操作エリア
======================================================== -->

<section class="status-control-panel">

  <!-- 左側：BET・MAX BET -->
<div class="bet-control-area">
  <button id="betButton" class="metal-button bet-button">
    BET
  </button>

  <button id="maxBetButton" class="metal-button max-bet-button">
    MAX
  </button>
</div>

  <!-- 右側：情報表示 -->
  <div class="panel info-panel">
    <div class="info-box">
      <div class="info-label">CREDIT</div>
      <div id="credit" class="info-value">50</div>
    </div>

    <div class="info-box">
      <div class="info-label">BET</div>
      <div id="bet" class="info-value">0</div>
    </div>

    <div class="info-box">
      <div class="info-label">PAYOUT</div>
      <div id="payout" class="info-value">0</div>
    </div>
  </div>

</section>

<!-- =======================================================
     START・STOP操作卓
======================================================== -->

<section class="operation-panel">

  <div class="main-control-row">

    <button id="startButton" class="start-button" disabled>
      <span class="start-main">START</span>
      <span class="start-sub">レバー</span>
    </button>

    <button id="stop0" class="stop-button" disabled>
      STOP
    </button>

    <button id="stop1" class="stop-button" disabled>
      STOP
    </button>

    <button id="stop2" class="stop-button" disabled>
      STOP
    </button>

  </div>

</section>

<!-- =======================================================
     下パネル
======================================================== -->

<section class="panel lower-panel">
  <div class="lower-panel-inner">
    <div class="lower-placeholder">
      PANEL AREA
    </div>
  </div>
</section>

<div class="footer">
        2D固定視点＋CSS立体表現＋Canvas演出<br>
        外部画像・外部ライブラリ不使用
      </div>
    </div>
  </div>
</div>

<div id="payEffect" class="pay-effect">+15</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/reels.js"></script>
<script src="js/effects.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
