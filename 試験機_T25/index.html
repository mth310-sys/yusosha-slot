<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>遊創舎 2.5D筐体試験機</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cabinet.css">
<link rel="stylesheet" href="css/reels.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="page">
  <div class="wrap">

    <div id="machine" class="machine">
      <canvas id="fxCanvas"></canvas>

      <div class="side-led left"></div>
      <div class="side-led right"></div>

      <div class="top-led"></div>

      <section class="panel title-panel">
        <div class="brand">🌱 遊創舎</div>
        <h1 class="title">⚡ 2.5D 試験機 ⚡</h1>
        <div class="version">YUSOSHA SLOT Ver.T25-0.2</div>
      </section>

      <section class="panel reel-panel">
        <div class="reel-row">

          <div class="lamp-frame">
            <div id="lamp" class="lamp">PEKA</div>
          </div>

          <div class="reel-window">
            <div class="reels">

              <div id="reel0" class="reel">
                <div class="reel-strip">
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                </div>
              </div>

              <div id="reel1" class="reel">
                <div class="reel-strip">
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                </div>
              </div>

              <div id="reel2" class="reel">
                <div class="reel-strip">
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                  <div class="symbol">🍇</div>
                  <div class="symbol">🍒</div>
                  <div class="symbol">🔔</div>
                  <div class="symbol red7">7</div>
                  <div class="symbol">⭐</div>
                  <div class="symbol bar">BAR</div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <div id="message" class="message">BETしてください</div>
      </section>

      <section class="panel info-panel">
        <div class="info-box">
          <div class="info-label">CREDIT</div>
          <div id="credit" class="info-value">50</div>
        </div>

        <div class="info-box">
          <div class="info-label">BET</div>
          <div id="bet" class="info-value">0</div>
        </div>

        <div class="info-box">
          <div class="info-label">PAYOUT</div>
          <div id="payout" class="info-value">0</div>
        </div>
      </section>

      <section class="operation-panel">
        <div class="control-row">
          <button id="startButton" class="metal-button" disabled>
            START<br>レバー
          </button>

          <button id="betButton" class="metal-button">
            BET
          </button>

          <button id="maxBetButton" class="metal-button">
            MAX<br>BET
          </button>
        </div>

        <div class="stop-row">
          <button id="stop0" class="stop-button" disabled>STOP</button>
          <button id="stop1" class="stop-button" disabled>STOP</button>
          <button id="stop2" class="stop-button" disabled>STOP</button>
        </div>
      </section>

      <div class="footer">
        2D固定視点＋CSS立体表現＋Canvas演出<br>
        外部画像・外部ライブラリ不使用
      </div>
    </div>
  </div>
</div>

<div id="payEffect" class="pay-effect">+15</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/reels.js"></script>
<script src="js/effects.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script>
"use strict";


/* =========================================================
   ゲーム状態
========================================================= */
/* =========================================================
   DOM
========================================================= */

const machine       = document.getElementById("machine");
const lamp          = document.getElementById("lamp");
const message       = document.getElementById("message");
const creditElement = document.getElementById("credit");
const betElement    = document.getElementById("bet");
const payoutElement = document.getElementById("payout");
const startButton   = document.getElementById("startButton");
const betButton     = document.getElementById("betButton");
const maxBetButton  = document.getElementById("maxBetButton");

const stopButtons = [
  document.getElementById("stop0"),
  document.getElementById("stop1"),
  document.getElementById("stop2")
];

const reelElements = [
  document.getElementById("reel0"),
  document.getElementById("reel1"),
  document.getElementById("reel2")
];

const reelStrips = reelElements.map(r => r.querySelector(".reel-strip"));

const payEffect = document.getElementById("payEffect");

/* =========================================================
   リール位置ヘルパー
========================================================= */

/*
 * rawPos → 表示用 displayPos ∈ [LOOP_LEN, 2*LOOP_LEN)
 * CSS translateY = -displayPos でストリップを正しい位置に配置する。
 * ストリップは同一パターンを3コピー持つため、
 * displayPos がどの範囲にあっても中段コピーが表示される。
 */

/* =========================================================
   表示更新
========================================================= */
/* =========================================================
   BET
========================================================= */
/* =========================================================
   抽選
========================================================= */
/* =========================================================
   スタート
========================================================= */
/* =========================================================
   押下表現
========================================================= */
/* =========================================================
   Canvas演出
========================================================= */
/* =========================================================
   イベント
========================================================= */

betButton.addEventListener("click",    () => { pressVisual(betButton);    betOne(); });
maxBetButton.addEventListener("click", () => { pressVisual(maxBetButton); maxBet(); });
startButton.addEventListener("click",  () => { pressVisual(startButton);  startSpin(); });

stopButtons.forEach((button, index) => {
  button.addEventListener("click", () => stopReel(index));
});

window.addEventListener("resize", resizeCanvas);

/* =========================================================
   初期化
   初期表示: リール0=🍒, リール1=🍇, リール2=🔔 を中央に
   displayPos = LOOP_LEN + ((t-1+N)%N)*SH  で計算
     CHERRY(t=3 on reel0): 480 + 2*80 = 640
     GRAPE (t=2 on reel1): 480 + 1*80 = 560
     BELL  (t=2 on reel2): 480 + 1*80 = 560
========================================================= */


reelStates.forEach((rs, i) => {
  rs.rawPos = INIT_DISPLAY_POS[i];
  applyStripPos(i);
});

resizeCanvas();
animateParticles();
updateUi();
</script>

</body>
</html>
