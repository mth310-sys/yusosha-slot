name: Next-Gen Slot iPhone Playtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/nextgen_pachislot_expression_lab/**'
      - 'research/yuyu_normal_type_lab/**'
      - 'playtest/**'
      - 'playwright.config.js'
      - '.github/workflows/nextgen-slot-playtest.yml'

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright test + WebKit
        run: |
          npm install --no-save @playwright/test@1.52.0
          npx playwright install --with-deps webkit
      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/design-lab-playtest-server.log 2>&1 &
          sleep 2
      - name: Run generic pachislot baseline iPhone playtest
        run: npx playwright test playtest/nextgen-slot.spec.js --project=webkit-iphone12 --reporter=line
      - name: Run YUYU normal-type iPhone playtest
        run: npx playwright test playtest/yuyu-normal.spec.js --project=webkit-iphone12 --reporter=line
      - name: Upload generic visual and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-slot-playtest-evidence
          path: playtest/evidence/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload YUYU visual and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuyu-normal-playtest-evidence
          path: playtest/evidence-yuyu/**
          if-no-files-found: warn
          retention-days: 7
