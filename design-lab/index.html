<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊創舎 Design Lab</title>
<link rel="stylesheet" href="CSS/base.css">
<link rel="stylesheet" href="CSS/layout.css">
<link rel="stylesheet" href="CSS/preview.css">
<link rel="stylesheet" href="CSS/frames/f1.css">
<link rel="stylesheet" href="CSS/frames/f2.css">
<link rel="stylesheet" href="CSS/frames/f3.css">
<link rel="stylesheet" href="CSS/frames/f4.css">
<link rel="stylesheet" href="CSS/frames/f5.css">
<link rel="stylesheet" href="CSS/frames/f6.css">
<link rel="stylesheet" href="CSS/frames/f7.css">
<link rel="stylesheet" href="CSS/frames/f8.css">
<link rel="stylesheet" href="CSS/frames/f9.css">
<link rel="stylesheet" href="CSS/frames/f9-debug.css">
<link rel="stylesheet" href="CSS/editor.css">
<link rel="stylesheet" href="CSS/controls.css">
<link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>
<main class="app">
<header><h1>遊創舎 Design Lab</h1><p>Frame Preview Ver.F1 / F2 / F3 / F4 / F5 / F6 / F7 / F8 / F9</p></header>
<section class="preview" aria-labelledby="preview-heading">
<div class="preview-title"><strong id="preview-heading">Preview</strong><span>390 × 600</span></div>
<div class="preview-area"><div class="canvas-guide" id="framePreview" role="img" aria-label="選択中のフレームプレビュー"></div></div>
<div class="preview-caption"><span id="frameCode">F1</span><strong id="frameName">ホワイト・ブルーフレーム</strong></div>
</section>
<nav class="frame-switcher" aria-label="フレーム選択">
<button class="frame-option active" type="button" data-frame="f1" aria-pressed="true">F1</button>
<button class="frame-option" type="button" data-frame="f2" aria-pressed="false">F2</button>
<button class="frame-option" type="button" data-frame="f3" aria-pressed="false">F3</button>
<button class="frame-option" type="button" data-frame="f4" aria-pressed="false">F4</button>
<button class="frame-option" type="button" data-frame="f5" aria-pressed="false">F5</button>
<button class="frame-option" type="button" data-frame="f6" aria-pressed="false">F6</button>
<button class="frame-option" type="button" data-frame="f7" aria-pressed="false">F7</button>
<button class="frame-option" type="button" data-frame="f8" aria-pressed="false">F8</button>
<button class="frame-option" type="button" data-frame="f9" aria-pressed="false">F9</button>
</nav>
<section id="editor" aria-live="polite"></section>
</main>
<script src="JS/config.js"></script>
<script src="JS/state.js"></script>
<script src="JS/ui.js"></script>
<script src="JS/frames/f1.js"></script>
<script src="JS/frames/f2.js"></script>
<script src="JS/frames/f3.js"></script>
<script src="JS/frames/f4.js"></script>
<script src="JS/frames/f5.js"></script>
<script src="JS/frames/f6.js"></script>
<script src="JS/frames/f7.js"></script>
<script src="JS/frames/f8.js"></script>
<script src="JS/frames/f9.js"></script>
<script src="JS/frames/layer-adapter.js"></script>
<script src="JS/preview.js"></script>
<script src="JS/main.js"></script>
</body>
</html>
