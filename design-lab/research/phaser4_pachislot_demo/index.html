<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>YuSosha Phaser 4 Pachislot Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05060a;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:10px}.lab{width:min(100%,430px)}.head{display:flex;justify-content:space-between;align-items:end;margin:0 4px 8px}.head b{letter-spacing:.12em}.head small{color:#8d96ad}.machine{position:relative;border:2px solid #68728d;border-radius:28px;padding:12px;background:linear-gradient(145deg,#303747,#090b11 18%,#171b25 52%,#05060a 82%,#343c4e);box-shadow:0 20px 60px #000,inset 0 0 30px #000}.led{position:absolute;top:58px;bottom:105px;width:8px;border-radius:8px;background:#1b2230;box-shadow:0 0 0 1px #4c566f}.led.l{left:3px}.led.r{right:3px}.led.on{background:#e8f4ff;box-shadow:0 0 8px #fff,0 0 20px #8ad8ff,0 0 38px #6a75ff}.screen{height:250px;border:3px solid #0b0d12;border-radius:17px;overflow:hidden;background:#02040a;box-shadow:inset 0 0 22px #000,0 0 0 1px #59647d}#game{width:100%;height:100%}.reels{margin:10px auto 8px;width:88%;height:102px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;background:#d5d8df;border-radius:8px;box-shadow:inset 0 0 10px #555}.reel{display:grid;place-items:center;background:linear-gradient(#fff,#dfe3ea,#fff);color:#111;font-size:34px;font-weight:900;border:1px solid #737986;overflow:hidden}.reel.spin{animation:spinflash .09s linear infinite}@keyframes spinflash{50%{filter:blur(2px);transform:translateY(2px)}}.status{text-align:center;height:22px;font:700 12px/22px ui-monospace,monospace;color:#9ea9c2}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stop,.start,.mode{border:0;color:#fff;font-weight:900;touch-action:manipulation}.stop{height:52px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff8a8a,#d51025 45%,#5b0009 75%);box-shadow:inset 0 -5px 8px #56000a,0 3px 8px #000}.stop:disabled{filter:grayscale(1);opacity:.45}.bottom{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;align-items:center;margin-top:10px}.start{height:48px;border-radius:12px;background:linear-gradient(#45d77e,#0d6e39);box-shadow:inset 0 -4px 8px #064523}.mode{height:40px;border-radius:10px;background:#242b3a;border:1px solid #59647d}.mode.active{background:#4b3da4}.note{margin:10px 4px 0;color:#8993aa;font-size:11px;line-height:1.45}.flash{position:absolute;inset:0;border-radius:28px;pointer-events:none;opacity:0;background:white;mix-blend-mode:screen}.flash.go{animation:flash .55s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}
</style>
</head><body><main class="lab"><div class="head"><b>YuSosha // PHASER 4 LAB</b><small>v0.1 · 4.2.1</small></div><section class="machine"><i class="led l"></i><i class="led r"></i><div class="flash"></div><div class="screen"><div id="game"></div></div><div class="reels"><div class="reel">7</div><div class="reel">◆</div><div class="reel">BAR</div></div><div class="status">READY — STARTを押してください</div><div class="controls"><button class="stop" disabled>STOP 1</button><button class="stop" disabled>STOP 2</button><button class="stop" disabled>STOP 3</button></div><div class="bottom"><button class="mode" id="basic">BASIC</button><button class="start">START</button><button class="mode active" id="full">FULL</button></div></section><p class="note">同じ当選演出を BASIC / FULL で比較する表現試験機。FULLではカメラ、レイヤー、Tween、粒子、筐体LED、停止タイミングを一つの時間軸に同期します。ゲーム性・確率は実装していません。</p></main>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script>
const W=390,H=250;let sceneRef,mode='full',step=0,running=false;
class Demo extends Phaser.Scene{
 constructor(){super('demo')}
 create(){sceneRef=this;this.makeWorld();}
 makeWorld(){
  this.cameras.main.setBackgroundColor('#06101b');
  const g=this.add.graphics();g.fillStyle(0x071321).fillRect(0,0,W,H);g.fillStyle(0x10283d).fillRect(0,148,W,102);
  for(let i=0;i<11;i++){const x=i*42-10,h=45+(i%4)*16;g.fillStyle(i%2?0x132f43:0x0d2436).fillRect(x,148-h,34,h);for(let y=0;y<3;y++)g.fillStyle(0x536c68,.32).fillRect(x+7,116-h+y*15,4,7)}
  this.moon=this.add.circle(320,47,22,0x9eb6c5,.25);this.hero=this.add.container(195,142);const aura=this.add.circle(0,0,42,0x6a7dff,.08);const body=this.add.rectangle(0,24,42,78,0x1b2230).setStrokeStyle(2,0x7684a8);const head=this.add.circle(0,-27,20,0xc5cad5);const eye=this.add.rectangle(7,-29,8,3,0x79d9ff);this.hero.add([aura,body,head,eye]);this.aura=aura;this.eye=eye;
  this.title=this.add.text(W/2,28,'NIGHT DISTRICT',{fontFamily:'monospace',fontSize:'12px',color:'#72829f',letterSpacing:3}).setOrigin(.5);
  this.msg=this.add.text(W/2,214,'通常状態',{fontFamily:'sans-serif',fontSize:'14px',fontStyle:'bold',color:'#aebbd3'}).setOrigin(.5);
  this.dots=[];for(let i=0;i<34;i++){let d=this.add.circle(Math.random()*W,Math.random()*H,1+Math.random()*2,0x9adfff,.12);this.dots.push(d);this.tweens.add({targets:d,y:d.y-30-Math.random()*50,alpha:{from:.05,to:.35},duration:1500+Math.random()*1800,yoyo:true,repeat:-1,delay:Math.random()*900})}
 }
 resetFx(){this.cameras.main.resetFX();this.hero.setScale(1).setAngle(0);this.aura.setScale(1).setAlpha(.08);this.eye.setFillStyle(0x79d9ff);this.msg.setText('通常状態').setColor('#aebbd3');this.title.setText('NIGHT DISTRICT');this.dots.forEach(d=>d.setVisible(true));}
 stopBeat(n){if(mode==='basic'){this.msg.setText('STOP '+n);return}if(n===1){this.msg.setText('…違和感');this.tweens.add({targets:this.moon,alpha:.05,duration:180});this.cameras.main.shake(80,.002)}if(n===2){this.msg.setText('気配が近い');this.tweens.add({targets:this.hero,scale:1.06,duration:170,yoyo:true});this.dots.forEach((d,i)=>{if(i%2===0)d.setVisible(false)})}if(n===3)this.hit();}
 hit(){this.msg.setText('');this.cameras.main.flash(100,210,230,255);this.cameras.main.shake(260,.012);this.tweens.add({targets:this.hero,scale:1.34,duration:180,ease:'Back.Out'});this.tweens.add({targets:this.aura,scale:3.4,alpha:.48,duration:420,ease:'Cubic.Out'});this.eye.setFillStyle(0xffffff);this.time.delayedCall(180,()=>{this.title.setText('SIGNAL LOCKED').setColor('#ffffff');this.msg.setText('BONUS').setColor('#ffffff').setFontSize(34);document.querySelectorAll('.led').forEach(x=>x.classList.add('on'));document.querySelector('.flash').classList.remove('go');void document.querySelector('.flash').offsetWidth;document.querySelector('.flash').classList.add('go')})}
}
new Phaser.Game({type:Phaser.AUTO,width:W,height:H,parent:'game',backgroundColor:'#05070d',scene:Demo,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
const reels=[...document.querySelectorAll('.reel')],stops=[...document.querySelectorAll('.stop')],status=document.querySelector('.status'),start=document.querySelector('.start');
function setMode(m){mode=m;document.querySelector('#basic').classList.toggle('active',m==='basic');document.querySelector('#full').classList.toggle('active',m==='full');status.textContent=(m==='full'?'FULL':'BASIC')+' MODE — READY';}
document.querySelector('#basic').onclick=()=>!running&&setMode('basic');document.querySelector('#full').onclick=()=>!running&&setMode('full');
start.onclick=()=>{if(running||!sceneRef)return;running=true;step=0;sceneRef.resetFx();document.querySelectorAll('.led').forEach(x=>x.classList.remove('on'));reels.forEach(r=>r.classList.add('spin'));stops.forEach((b,i)=>{b.disabled=i!==0});status.textContent='REELS SPINNING — STOP 1';if(mode==='full'){sceneRef.cameras.main.zoomTo(1.025,220);sceneRef.tweens.add({targets:sceneRef.hero,x:202,duration:260,yoyo:true})}};
stops.forEach((b,i)=>b.onclick=()=>{if(!running||i!==step)return;reels[i].classList.remove('spin');b.disabled=true;sceneRef.stopBeat(i+1);step++;if(step<3){stops[step].disabled=false;status.textContent='STOP '+(step+1)+' を押してください'}else{status.textContent=mode==='full'?'FULL — LIQUID / REEL / LED SYNC':'BASIC — SIMPLE STATE CHANGE';setTimeout(()=>{running=false;status.textContent=(mode==='full'?'FULL':'BASIC')+' MODE — READY'},1200)}});
</script></body></html>
