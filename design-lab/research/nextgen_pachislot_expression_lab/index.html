<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050609">
<title>YuSosha Phaser Pachislot Baseline</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./reel-v02.css">
</head>
<body>
<main class="lab">
  <header class="lab-head"><div><b>YuSosha // NEXT-GEN SLOT LAB</b><small>Integrated 1G Expression Prototype</small></div><span id="fps">-- FPS</span></header>
  <section class="machine" id="machine" data-phase="idle">
    <div class="cabinet-reflection"></div><div class="side-light side-light-l" aria-hidden="true"></div><div class="side-light side-light-r" aria-hidden="true"></div><div class="top-light" aria-hidden="true"></div>
    <div class="bezel"><div class="glass"><div id="game" aria-label="パチスロ試験画面"></div><div class="glass-glare" aria-hidden="true"></div></div></div>
    <div class="status-row"><span id="modeLabel">FULL</span><strong id="status">BETしてください</strong><span id="credit">CREDIT 50</span></div>
    <div class="control-deck"><button id="bet" class="button bet">BET</button><button id="start" class="lever" disabled><span></span><b>START</b></button><div class="stop-bank"><button class="stop" data-stop="0" disabled><i></i><b>STOP 1</b></button><button class="stop" data-stop="1" disabled><i></i><b>STOP 2</b></button><button class="stop" data-stop="2" disabled><i></i><b>STOP 3</b></button></div></div>
    <div class="lower-panel"><div class="speaker"></div><div class="title-plate"><span>NOCTURNE</span><small>PROTOCOL / 01</small></div><div class="speaker"></div></div>
  </section>
  <section class="tools"><div class="mode-switch" role="group" aria-label="表現モード"><button id="basicMode">BASIC</button><button id="fullMode" class="active">FULL</button></div><button id="audioToggle" class="audio-toggle">AUDIO ON</button></section>
  <details class="debug"><summary>EVENT LOG</summary><pre id="eventLog"></pre></details>
  <p class="note">Phaser基準機を準備中。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script defer src="./app.js"></script>
<script defer src="./reel-v02.js"></script>
<script defer src="./reel-v021.js"></script>
<script defer src="./reel-v022.js"></script>
<script defer src="./reel-v023.js"></script>
<script defer src="./reel-v024.js"></script>
<script defer src="./audio-v021.js"></script>
<script defer src="./phaser-research-v030.js"></script>
<script defer src="./phaser-baseline-v040.js"></script>
</body>
</html>
