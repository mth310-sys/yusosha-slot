<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>遊創舎 2.5D筐体試験機</title>

<style>
/* =========================================================
   遊創舎 2.5D筐体試験機 Ver.T25-0.2

   目的
   ・固定視点2D筐体
   ・CSSによる金属、ガラス、奥行き表現
   ・Canvasによる雷、火花、粒子演出
   ・連続縦回転リール（translateY + requestAnimationFrame）
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --machine-width: 390px;

  --black-1: #020202;
  --black-2: #0a0a0a;
  --black-3: #171717;

  --gold-1: #fff28a;
  --gold-2: #e5bd00;
  --gold-3: #8a5d00;

  --yellow: #fff200;
  --orange: #ff9700;
  --red: #e80000;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  background:
    radial-gradient(circle at 50% 28%, #4c3c00 0%, #171100 28%, #030303 72%);

  text-align: center;
  overflow-x: hidden;
}

button {
  font: inherit;
  touch-action: manipulation;
}

.page {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 8px 4px 30px;
}

.wrap {
  width: min(100%, var(--machine-width));
  position: relative;
}

/* =========================================================
   筐体外装
========================================================= */

.machine {
  position: relative;
  width: 100%;
  overflow: hidden;

  padding: 10px 14px 14px;

  border: 5px solid #d3aa00;
  border-radius: 27px;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.65) 0%,
      rgba(255,255,255,.08) 4%,
      transparent 11%,
      transparent 88%,
      rgba(255,255,255,.25) 96%,
      rgba(255,255,255,.6) 100%
    ),
    linear-gradient(
      145deg,
      #555 0%,
      #080808 8%,
      #111 44%,
      #030303 72%,
      #3a3005 100%
    );

  box-shadow:
    0 20px 28px rgba(0,0,0,.75),
    0 0 25px rgba(255,230,0,.85),
    0 0 55px rgba(255,166,0,.38),
    inset 0 0 0 3px #231d05,
    inset 0 0 35px #000;
}

.machine::before {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,.65);

  box-shadow:
    0 0 8px rgba(255,255,255,.7),
    0 0 18px rgba(255,230,0,.45),
    inset 0 0 12px rgba(255,220,0,.22);

  pointer-events: none;
  z-index: 30;
}

.machine::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      115deg,
      transparent 0 29%,
      rgba(255,255,255,.1) 31%,
      transparent 34% 65%,
      rgba(255,255,255,.06) 68%,
      transparent 72%
    );

  pointer-events: none;
  z-index: 29;
}

/* =========================================================
   Canvas演出
========================================================= */

#fxCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

  pointer-events: none;
  z-index: 28;
}

/* =========================================================
   LED
========================================================= */

.side-led {
  position: absolute;
  z-index: 8;

  top: 55px;
  bottom: 38px;
  width: 9px;

  border-radius: 10px;

  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0 4px,
      #fff200 5px 9px,
      #ff9d00 10px 13px,
      #3d2a00 14px 17px
    );

  box-shadow:
    0 0 8px #fff,
    0 0 15px var(--yellow),
    0 0 26px var(--orange);

  animation: sidePulse .65s infinite alternate;
}

.side-led.left {
  left: 7px;
}

.side-led.right {
  right: 7px;
}

.top-led {
  position: relative;
  z-index: 10;

  height: 22px;
  margin: 0 34px 7px;

  border-radius: 0 0 18px 18px;

  background:
    linear-gradient(
      90deg,
      #422e00,
      #fff200,
      #fff,
      #ff9d00,
      #fff,
      #fff200,
      #422e00
    );

  clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);

  box-shadow:
    0 0 11px #fff,
    0 0 22px var(--yellow),
    inset 0 0 9px #fff;

  animation: topLed 1.1s linear infinite;
}

/* =========================================================
   共通パネル
========================================================= */

.panel {
  position: relative;
  z-index: 10;

  border: 2px solid #cfcfcf;
  border-radius: 15px;

  background:
    linear-gradient(
      130deg,
      rgba(255,255,255,.18),
      transparent 18%,
      transparent 78%,
      rgba(255,215,0,.12)
    ),
    radial-gradient(circle at 50% 42%, #201a00, #050505 72%);

  box-shadow:
    0 0 0 2px #111,
    0 0 11px rgba(255,255,255,.72),
    0 0 18px rgba(255,214,0,.75),
    inset 0 0 20px #000;

  overflow: hidden;
}

.panel::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      112deg,
      transparent 0 25%,
      rgba(255,255,255,.13) 28%,
      transparent 32%
    );

  pointer-events: none;
}

/* =========================================================
   タイトル
========================================================= */

.title-panel {
  padding: 8px 6px 7px;
  margin-bottom: 7px;
}

.brand {
  font-size: 10px;
  color: #a6ffa6;
  opacity: .78;
  text-shadow: 0 0 7px #3cff3c;
}

.title {
  margin: 0;
  font-size: 31px;
  line-height: 1.12;

  color: var(--yellow);

  letter-spacing: 1px;

  text-shadow:
    0 0 8px #fff,
    0 0 15px var(--yellow),
    0 0 24px var(--orange),
    2px 2px 0 #111;
}

.version {
  margin-top: 3px;
  font-size: 10px;
  color: #fff2a2;
}

/* =========================================================
   リール部
========================================================= */

.reel-panel {
  padding: 9px 6px 7px;
  margin-bottom: 7px;
}

.reel-row {
  display: grid;
  grid-template-columns: 51px 1fr;
  align-items: center;
  gap: 7px;
}

.lamp-frame {
  position: relative;
  padding: 4px;

  border-radius: 13px;

  background:
    linear-gradient(145deg, #fffbc7, #9d7400 22%, #332500 55%, #ffd900);

  box-shadow:
    0 0 10px #fff,
    0 0 17px var(--yellow),
    inset 0 0 6px #000;
}

.lamp {
  height: 50px;

  display: grid;
  place-items: center;

  border-radius: 9px;

  color: #9e7e20;
  font-size: 12px;
  font-weight: 900;

  border: 1px solid #685000;

  background:
    radial-gradient(circle, #372600, #120b00 75%);

  box-shadow:
    inset 0 0 11px #000;
}

.lamp.on {
  color: #543000;

  background:
    radial-gradient(
      circle,
      #fff 0 9%,
      #fff9a6 18%,
      #ffe500 46%,
      #ff8b00 100%
    );

  box-shadow:
    0 0 13px #fff,
    0 0 25px var(--yellow),
    0 0 42px var(--orange),
    inset 0 0 7px #fff;

  animation: lampPulse .28s infinite alternate;
}

.reel-window {
  position: relative;
  padding: 8px 7px;

  border-radius: 14px;

  background:
    linear-gradient(#353535, #070707 12%, #101010 88%, #3d3d3d);

  border: 3px solid #a7a7a7;

  box-shadow:
    inset 0 8px 15px #000,
    inset 0 -8px 15px #000,
    0 0 0 2px #080808,
    0 0 12px #fff,
    0 0 19px #ffdd00;
}

.reel-window::before {
  content: "";
  position: absolute;
  inset: 7px;

  border-radius: 9px;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.68),
      transparent 24%,
      transparent 75%,
      rgba(0,0,0,.72)
    );

  pointer-events: none;
  z-index: 5;
}

.reel-window::after {
  content: "";
  position: absolute;
  inset: 7px;

  border-radius: 9px;

  background:
    linear-gradient(
      115deg,
      transparent 0 25%,
      rgba(255,255,255,.32) 29%,
      transparent 34% 66%,
      rgba(255,255,255,.12) 70%,
      transparent 75%
    );

  pointer-events: none;
  z-index: 6;
}

.reels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.reel {
  position: relative;
  height: 240px;
  overflow: hidden;

  border-radius: 9px;

  background:
    linear-gradient(90deg, #aaa, #fff 15%, #fff 85%, #999);

  border: 2px solid #666;

  box-shadow:
    inset 0 0 13px #888,
    0 0 0 2px #111;
}

.reel-strip {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;

  will-change: transform;
}

.symbol {
  height: 80px;

  display: grid;
  place-items: center;

  font-size: 38px;
  font-weight: 900;

  color: #111;

  background:
    linear-gradient(
      to bottom,
      #f5f5f5,
      #fff 45%,
      #ddd 55%,
      #fafafa
    );

  border-bottom: 1px solid #d0d0d0;

  text-shadow: 0 1px 0 #fff;
}

.symbol.red7 {
  color: #e00000;
  font-family: Arial Black, sans-serif;
  font-size: 48px;

  text-shadow:
    2px 2px 0 #ffd000,
    0 0 8px rgba(255,0,0,.45);
}

.symbol.bar {
  font-size: 24px;
  letter-spacing: -2px;

  color: #111;

  background:
    linear-gradient(#fafafa, #fff, #e8e8e8);
}

.reel.stop-flash {
  animation: reelStopFlash .24s;
}

.reel.hot {
  box-shadow:
    inset 0 0 13px #888,
    0 0 0 2px #111,
    0 0 11px #fff,
    0 0 20px var(--yellow),
    0 0 31px var(--orange);
}

.message {
  min-height: 28px;
  margin-top: 7px;

  font-size: 18px;
  font-weight: 900;

  color: var(--yellow);

  text-shadow:
    0 0 6px #fff,
    0 0 13px var(--orange);
}

/* =========================================================
   情報パネル
========================================================= */

.info-panel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

  padding: 7px 5px;
  margin-bottom: 7px;
}

.info-box {
  border-right: 1px solid #292929;
}

.info-box:last-child {
  border-right: 0;
}

.info-label {
  font-size: 9px;
  color: #fff0a3;
}

.info-value {
  margin-top: 1px;

  font-family: "Courier New", monospace;
  font-size: 28px;
  font-weight: 900;

  color: #ff2828;

  text-shadow:
    0 0 7px red,
    0 0 13px #6c0000;
}

/* =========================================================
   操作卓
========================================================= */

.operation-panel {
  position: relative;
  z-index: 10;

  padding: 9px 9px 11px;
  margin-bottom: 8px;

  border-radius: 17px;
  border: 2px solid #c89c00;

  background:
    linear-gradient(
      160deg,
      #fff4a3 0%,
      #907000 5%,
      #151515 17%,
      #050505 70%,
      #4c3a00 92%,
      #ffe76d 100%
    );

  box-shadow:
    0 8px 8px rgba(0,0,0,.75),
    0 0 12px #fff,
    0 0 20px var(--yellow),
    inset 0 0 15px #000;
}

.control-row {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 8px;

  margin-bottom: 10px;
}

.metal-button {
  min-height: 54px;

  border: 3px solid #bfc2c5;
  border-radius: 12px;

  color: #181100;
  font-weight: 900;

  background:
    linear-gradient(
      145deg,
      #fff 0%,
      #fff59d 8%,
      #ffe000 43%,
      #b37d00 100%
    );

  box-shadow:
    inset 0 3px 4px rgba(255,255,255,.95),
    inset 0 -8px 10px rgba(0,0,0,.55),
    0 5px 0 #171717,
    0 0 0 3px #252525,
    0 0 13px #fff,
    0 0 18px var(--yellow);

  text-shadow: 0 1px 2px #fff;
}

.metal-button:active,
.metal-button.pressed {
  transform: translateY(4px);
  box-shadow:
    inset 0 4px 10px rgba(0,0,0,.65),
    0 1px 0 #111,
    0 0 8px var(--yellow);

  filter: brightness(.83);
}

.stop-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stop-button {
  position: relative;

  width: 68px;
  height: 68px;
  margin: auto;

  border-radius: 50%;
  border: 4px solid #f3f3f3;

  color: white;
  font-size: 13px;
  font-weight: 900;

  background:
    radial-gradient(
      circle at 34% 25%,
      #fff 0 5%,
      #ff6a6a 11%,
      #e00000 42%,
      #680000 82%
    );

  box-shadow:
    inset 0 5px 7px rgba(255,255,255,.85),
    inset 0 -10px 13px rgba(0,0,0,.78),
    0 5px 0 #050505,
    0 0 0 4px #151515,
    0 0 0 7px #cfcfcf,
    0 0 14px #fff,
    0 0 21px var(--yellow);

  text-shadow: 0 0 7px #fff;
}

.stop-button::before {
  content: "";
  position: absolute;
  inset: -7px;

  border: 2px solid var(--yellow);
  border-radius: 50%;

  box-shadow:
    0 0 9px #fff,
    0 0 16px var(--yellow);

  pointer-events: none;
}

.stop-button:active,
.stop-button.pressed {
  transform: translateY(5px) scale(.97);

  box-shadow:
    inset 0 9px 14px rgba(0,0,0,.82),
    0 1px 0 #050505,
    0 0 0 4px #151515,
    0 0 0 7px #cfcfcf,
    0 0 9px var(--yellow);
}

button:disabled {
  opacity: .35;
  filter: grayscale(.65);
}

.footer {
  position: relative;
  z-index: 10;

  color: #e8dda4;
  font-size: 10px;
  line-height: 1.45;
}

/* =========================================================
   画面演出
========================================================= */

body.flash {
  animation: screenFlash .22s 4;
}

body.shake .machine {
  animation: machineShake .08s 8;
}

.pay-effect {
  position: fixed;
  z-index: 100;

  left: 50%;
  top: 45%;

  transform: translate(-50%, -50%);

  display: none;

  font-size: 42px;
  font-weight: 900;
  color: var(--yellow);

  text-shadow:
    0 0 12px #fff,
    0 0 24px var(--orange);
}

.pay-effect.show {
  display: block;
  animation: payPop .9s forwards;
}

/* =========================================================
   アニメーション
========================================================= */

@keyframes sidePulse {
  from {
    opacity: .55;
    filter: brightness(.85);
  }
  to {
    opacity: 1;
    filter: brightness(1.7);
  }
}

@keyframes topLed {
  0% {
    filter: brightness(.85);
  }
  50% {
    filter: brightness(1.8);
  }
  100% {
    filter: brightness(.85);
  }
}

@keyframes lampPulse {
  from {
    transform: scale(1);
    filter: brightness(1);
  }
  to {
    transform: scale(1.04);
    filter: brightness(1.7);
  }
}

@keyframes reelStopFlash {
  0% {
    transform: scale(1.05);
    filter: brightness(1.8);
  }
  100% {
    transform: scale(1);
    filter: brightness(1);
  }
}

@keyframes screenFlash {
  0% {
    background: #fff;
  }
  45% {
    background: var(--yellow);
  }
  100% {
    background:
      radial-gradient(circle at 50% 28%, #4c3c00 0%, #171100 28%, #030303 72%);
  }
}

@keyframes machineShake {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(3px); }
  50%  { transform: translateX(-3px); }
  75%  { transform: translateX(2px); }
  100% { transform: translateX(0); }
}

@keyframes payPop {
  0% {
    opacity: 0;
    transform: translate(-50%, -20%) scale(.4);
  }
  30% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.25);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -100%) scale(1);
  }
}

/* =========================================================
   小型画面調整
========================================================= */

@media (max-width: 360px) {
  .title {
    font-size: 27px;
  }

  .reel {
    height: 219px;
  }

  .symbol {
    height: 73px;
    font-size: 34px;
  }

  .stop-button {
    width: 62px;
    height: 62px;
  }
}
</style>
</head>

"use strict";

/* =========================================================
   リールレイアウト定数
========================================================= */

const REEL_LAYOUTS = [
  ["RED7", "GRAPE", "BELL", "CHERRY", "STAR", "BAR"],  // リール0
  ["BELL", "RED7",  "GRAPE", "CHERRY", "STAR", "BAR"], // リール1
  ["GRAPE","CHERRY","BELL",  "RED7",   "STAR", "BAR"]  // リール2
];

const SH       = 80;        // シンボル高さ (px)
const N        = 6;         // パターン内シンボル数
const LOOP_LEN = N * SH;   // 480 px — 1パターン分の高さ
const MAX_SPEED = 8;        // 定速 (px/frame)
const ACCEL     = 0.5;      // 加速度 (px/frame²)

/* =========================================================
   ゲーム状態
========================================================= */

let credit = 50;
let bet    = 0;
let payout = 0;

let spinning      = [false, false, false];
let stopPressed   = [false, false, false];
let stoppedCount  = 0;  // STOPボタン押下数（MISS回避判定用）
let physicalCount = 0;  // 物理的に停止したリール数
let gameActive    = false;

let currentSymbols = ["", "", ""];
let targetResult   = "MISS";

/* リールアニメーション状態（リールごと） */
const reelStates = [0, 1, 2].map(() => ({
  rawPos:     LOOP_LEN, // 絶対位置（常に増加、正規化はbouncing終了時）
  speed:      0,
  state:      "idle",   // idle|accelerating|spinning|decelerating|bouncing
  targetPos:  0,
  decelA:     0,
  bouncePhase: -1
}));

/* =========================================================
   DOM
========================================================= */

const machine       = document.getElementById("machine");
const lamp          = document.getElementById("lamp");
const message       = document.getElementById("message");
const creditElement = document.getElementById("credit");
const betElement    = document.getElementById("bet");
const payoutElement = document.getElementById("payout");
const startButton   = document.getElementById("startButton");
const betButton     = document.getElementById("betButton");
const maxBetButton  = document.getElementById("maxBetButton");

const stopButtons = [
  document.getElementById("stop0"),
  document.getElementById("stop1"),
  document.getElementById("stop2")
];

const reelElements = [
  document.getElementById("reel0"),
  document.getElementById("reel1"),
  document.getElementById("reel2")
];

const reelStrips = reelElements.map(r => r.querySelector(".reel-strip"));

const payEffect = document.getElementById("payEffect");

/* =========================================================
   リール位置ヘルパー
========================================================= */

/*
 * rawPos → 表示用 displayPos ∈ [LOOP_LEN, 2*LOOP_LEN)
 * CSS translateY = -displayPos でストリップを正しい位置に配置する。
 * ストリップは同一パターンを3コピー持つため、
 * displayPos がどの範囲にあっても中段コピーが表示される。
 */
function getDisplayPos(rawPos) {
  return LOOP_LEN + ((rawPos - LOOP_LEN) % LOOP_LEN);
}

/* リールストリップの CSS transform を更新 */
function applyStripPos(i) {
  const rs = reelStates[i];
  const dp = getDisplayPos(rs.rawPos);
  let by = 0;
  if (rs.bouncePhase >= 0) {
    // 停止後の軽い揺り戻し
    const BOUNCE = [-5, -4, -2, 1, 2, 1, 0, -1, 0, 0, 0, 0];
    by = rs.bouncePhase < BOUNCE.length ? BOUNCE[rs.bouncePhase] : 0;
  }
  reelStrips[i].style.transform = `translateY(${-dp + by}px)`;
}

/*
 * 停止目標位置を計算する。
 * symbolKey が中央ラインに来る最短の targetPos と、
 * そこへ正確に到達するための decelA を返す。
 */
function getStopTarget(reelIndex, symbolKey, rawPos, speed) {
  const t = REEL_LAYOUTS[reelIndex].indexOf(symbolKey);

  // targetResidual: displayPos - LOOP_LEN でシンボル t が中央に来る残差 ∈ [0, LOOP_LEN)
  const targetResidual  = ((t - 1 + N) % N) * SH;
  const currentResidual = (rawPos - LOOP_LEN) % LOOP_LEN;

  let gap = (targetResidual - currentResidual + LOOP_LEN) % LOOP_LEN;
  if (gap === 0) gap = LOOP_LEN; // 現在位置に即停止させない

  // 最低2シンボル分の減速距離を確保
  while (gap < SH * 2) gap += LOOP_LEN;

  const targetPos = rawPos + gap;

  // 物理式: v²=2aD → a = v²/(2D)  →  rawPos + gap で速度がちょうど0になる
  const decelA = Math.max((speed * speed) / (2 * gap), 0.005);

  return { targetPos, decelA };
}

/* =========================================================
   リールアニメーション本体（animateParticles から毎フレーム呼ばれる）
========================================================= */

function tickAllReels() {
  for (let i = 0; i < 3; i++) {
    const rs = reelStates[i];
    if (rs.state === "idle") continue;

    if (rs.state === "accelerating") {
      rs.speed = Math.min(rs.speed + ACCEL, MAX_SPEED);
      if (rs.speed >= MAX_SPEED) rs.state = "spinning";
      rs.rawPos += rs.speed;

    } else if (rs.state === "spinning") {
      rs.rawPos += rs.speed;

    } else if (rs.state === "decelerating") {
      rs.speed = Math.max(0, rs.speed - rs.decelA);
      // 次フレームで目標を越えるか、速度ゼロになったらスナップ
      if (rs.speed === 0 || rs.rawPos + rs.speed >= rs.targetPos) {
        rs.rawPos     = rs.targetPos;
        rs.speed      = 0;
        rs.state      = "bouncing";
        rs.bouncePhase = 0;
        onReelPhysicallyStopped(i);
      } else {
        rs.rawPos += rs.speed;
      }

    } else if (rs.state === "bouncing") {
      rs.bouncePhase++;
      if (rs.bouncePhase >= 12) {
        rs.state      = "idle";
        rs.bouncePhase = -1;
        // rawPos を正規化して次スピン開始位置を整える
        rs.rawPos = getDisplayPos(rs.rawPos);
      }
    }

    applyStripPos(i);
  }
}

function onReelPhysicallyStopped(index) {
  spinning[index] = false;
  physicalCount++;

  // 停止フラッシュ
  reelElements[index].classList.remove("stop-flash");
  void reelElements[index].offsetWidth;
  reelElements[index].classList.add("stop-flash");

  if (targetResult === "RED7" || targetResult === "BAR") {
    reelElements[index].classList.add("hot");
  }

  updateUi();

  if (physicalCount === 3) {
    window.setTimeout(() => judgeResult(), 300);
  }
}

/* =========================================================
   表示更新
========================================================= */

function updateUi() {
  creditElement.textContent = String(credit);
  betElement.textContent    = String(bet);
  payoutElement.textContent = String(payout);

  const anySpinning = spinning.includes(true);
  const busy        = anySpinning || gameActive;

  startButton.disabled  = bet !== 3 || busy;
  betButton.disabled    = busy || bet >= 3 || credit <= 0;
  maxBetButton.disabled = busy || bet >= 3 || credit <= 0;

  stopButtons.forEach((button, index) => {
    button.disabled = !spinning[index] || stopPressed[index];
  });
}

function setMessage(text) {
  message.textContent = text;
}

/* =========================================================
   BET
========================================================= */

function betOne() {
  if (spinning.includes(true) || gameActive) return;
  if (credit <= 0 || bet >= 3) return;

  credit -= 1;
  bet    += 1;
  payout  = 0;

  lamp.classList.remove("on");
  setMessage(bet === 3 ? "STARTできます" : "BET中");
  updateUi();
}

function maxBet() {
  if (spinning.includes(true) || gameActive) return;

  while (bet < 3 && credit > 0) {
    credit -= 1;
    bet    += 1;
  }

  payout = 0;
  lamp.classList.remove("on");
  setMessage(bet === 3 ? "STARTできます" : "クレジット不足");
  updateUi();
}

/* =========================================================
   抽選
========================================================= */

function chooseResult() {
  const r = Math.random();
  if (r < 0.07) return "RED7";
  if (r < 0.13) return "BAR";
  if (r < 0.23) return "STAR";
  if (r < 0.36) return "BELL";
  if (r < 0.52) return "GRAPE";
  if (r < 0.70) return "CHERRY";
  return "MISS";
}

/* =========================================================
   スタート
========================================================= */

function startSpin() {
  if (bet !== 3 || spinning.includes(true) || gameActive) return;

  stoppedCount   = 0;
  physicalCount  = 0;
  payout         = 0;
  gameActive     = true;
  currentSymbols = ["", "", ""];
  stopPressed    = [false, false, false];

  targetResult = chooseResult();

  reelElements.forEach(reel => reel.classList.remove("hot", "stop-flash"));

  if (targetResult === "RED7" || targetResult === "BAR") {
    lamp.classList.add("on");
    setMessage("ペカッ！");
    sparkBurst(38);
  } else {
    lamp.classList.remove("on");
    setMessage("リール回転中");
  }

  for (let i = 0; i < 3; i++) {
    spinning[i]           = true;
    reelStates[i].speed   = 0;
    reelStates[i].state   = "accelerating";
    reelStates[i].bouncePhase = -1;
    // rawPos はそのまま（前回停止位置から継続して回転）
  }

  updateUi();
}

/* =========================================================
   停止
========================================================= */

function stopReel(index) {
  if (!spinning[index] || stopPressed[index]) return;

  const rs = reelStates[index];
  if (rs.state !== "accelerating" && rs.state !== "spinning") return;

  /* --- 停止図柄の決定 --- */
  let finalSymbol;

  if (["RED7", "BAR", "STAR", "BELL", "GRAPE"].includes(targetResult)) {
    finalSymbol = targetResult;

  } else if (targetResult === "CHERRY") {
    if (index === 0) {
      finalSymbol = "CHERRY";
    } else {
      const nonCherry = REEL_LAYOUTS[index].filter(k => k !== "CHERRY");
      finalSymbol = nonCherry[Math.floor(Math.random() * nonCherry.length)];
    }

  } else {
    // MISS: ランダム停止
    finalSymbol = REEL_LAYOUTS[index][Math.floor(Math.random() * N)];

    // 3番目のSTOP時に3枚揃いになる場合は回避
    if (stoppedCount === 2) {
      const others = [0, 1, 2].filter(j => j !== index);
      const s0 = currentSymbols[others[0]];
      const s1 = currentSymbols[others[1]];
      if (s0 !== "" && s0 === s1 && finalSymbol === s0) {
        const diff = REEL_LAYOUTS[index].filter(k => k !== s0);
        finalSymbol = diff[Math.floor(Math.random() * diff.length)];
      }
    }
  }

  currentSymbols[index] = finalSymbol;
  stopPressed[index]    = true;
  stoppedCount++;

  /* --- 減速目標を設定 --- */
  const { targetPos, decelA } = getStopTarget(index, finalSymbol, rs.rawPos, rs.speed);
  rs.targetPos = targetPos;
  rs.decelA    = decelA;
  rs.state     = "decelerating";

  pressVisual(stopButtons[index]);
  updateUi();
}

/* =========================================================
   判定
========================================================= */

function judgeResult() {
  gameActive = false;

  const [left, center, right] = currentSymbols;

  if      (left === "RED7"  && center === "RED7"  && right === "RED7")  { win(50, "BIG BONUS！！"); }
  else if (left === "BAR"   && center === "BAR"   && right === "BAR")   { win(20, "雷BONUS！！"); }
  else if (left === "STAR"  && center === "STAR"  && right === "STAR")  { win(15, "STAR 15枚"); }
  else if (left === "BELL"  && center === "BELL"  && right === "BELL")  { win(10, "ベル 10枚"); }
  else if (left === "GRAPE" && center === "GRAPE" && right === "GRAPE") { win(8,  "ブドウ 8枚"); }
  else if (currentSymbols.includes("CHERRY"))                           { win(2,  "チェリー 2枚"); }
  else {
    payout = 0;
    setMessage("ハズレ");
    window.setTimeout(() => {
      reelElements.forEach(reel => reel.classList.remove("hot"));
    }, 650);
  }

  bet = 0;
  updateUi();
}

function win(amount, text) {
  payout  = amount;
  credit += amount;

  setMessage(text);

  payEffect.textContent = `+${amount}`;
  payEffect.classList.remove("show");
  void payEffect.offsetWidth;
  payEffect.classList.add("show");

  document.body.classList.remove("flash", "shake");
  void document.body.offsetWidth;
  document.body.classList.add("flash", "shake");

  sparkBurst(85);

  window.setTimeout(() => {
    document.body.classList.remove("flash", "shake");
  }, 900);
}

/* =========================================================
   押下表現
========================================================= */

function pressVisual(element) {
  element.classList.add("pressed");
  window.setTimeout(() => element.classList.remove("pressed"), 130);
}

/* =========================================================
   Canvas演出
========================================================= */

const canvas  = document.getElementById("fxCanvas");
const context = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {
  const rect  = machine.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width  = Math.floor(rect.width  * ratio);
  canvas.height = Math.floor(rect.height * ratio);

  canvas.style.width  = `${rect.width}px`;
  canvas.style.height = `${rect.height}px`;

  context.setTransform(ratio, 0, 0, ratio, 0, 0);
}

function sparkBurst(count) {
  const rect    = machine.getBoundingClientRect();
  const centerX = rect.width  * 0.53;
  const centerY = rect.height * 0.32;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.3 + Math.random() * 4.4;
    particles.push({
      x: centerX, y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 35 + Math.random() * 35,
      size: 1 + Math.random() * 2.8,
      yellow: Math.random() > 0.35
    });
  }
}

function drawLightning() {
  if (!lamp.classList.contains("on")) return;
  if (Math.random() > 0.08) return;

  const width  = machine.clientWidth;
  const height = machine.clientHeight;

  let x = width * (0.2 + Math.random() * 0.6);
  let y = 45;

  context.save();
  context.strokeStyle = Math.random() > 0.4 ? "#fff200" : "#ffffff";
  context.lineWidth   = 1.2 + Math.random() * 1.5;
  context.shadowColor = "#fff200";
  context.shadowBlur  = 12;
  context.beginPath();
  context.moveTo(x, y);

  while (y < height * 0.52) {
    x += -11 + Math.random() * 22;
    y += 11  + Math.random() * 15;
    context.lineTo(x, y);
  }

  context.stroke();
  context.restore();
}

function animateParticles() {
  context.clearRect(0, 0, machine.clientWidth, machine.clientHeight);
  drawLightning();

  particles = particles.filter(p => p.life > 0);

  particles.forEach(p => {
    p.x  += p.vx;
    p.y  += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.vy += 0.025;
    p.life -= 1;

    const opacity = Math.max(0, p.life / 50);

    context.save();
    context.globalAlpha = opacity;
    context.fillStyle   = p.yellow ? "#fff200" : "#ffffff";
    context.shadowColor = "#ff9d00";
    context.shadowBlur  = 9;
    context.beginPath();
    context.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    context.fill();
    context.restore();
  });

  // リールアニメーションを毎フレーム更新
  tickAllReels();

  requestAnimationFrame(animateParticles);
}

/* =========================================================
   イベント
========================================================= */

betButton.addEventListener("click",    () => { pressVisual(betButton);    betOne(); });
maxBetButton.addEventListener("click", () => { pressVisual(maxBetButton); maxBet(); });
startButton.addEventListener("click",  () => { pressVisual(startButton);  startSpin(); });

stopButtons.forEach((button, index) => {
  button.addEventListener("click", () => stopReel(index));
});

window.addEventListener("resize", resizeCanvas);

/* =========================================================
   初期化
   初期表示: リール0=🍒, リール1=🍇, リール2=🔔 を中央に
   displayPos = LOOP_LEN + ((t-1+N)%N)*SH  で計算
     CHERRY(t=3 on reel0): 480 + 2*80 = 640
     GRAPE (t=2 on reel1): 480 + 1*80 = 560
     BELL  (t=2 on reel2): 480 + 1*80 = 560
========================================================= */

const INIT_DISPLAY_POS = [640, 560, 560];

reelStates.forEach((rs, i) => {
  rs.rawPos = INIT_DISPLAY_POS[i];
  applyStripPos(i);
});

resizeCanvas();
animateParticles();
updateUi();
</script>

</body>
</html>
