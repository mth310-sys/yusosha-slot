<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パチスロ筐体モデル</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --cabinet-width: 370px;
  --cabinet-height: 720px;
  --gold: #c7a72d;
  --gold-light: #f5dc72;
  --black: #050505;
  --metal: #777;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  padding: 24px 10px;

  background:
    radial-gradient(
      ellipse at center,
      #343434 0%,
      #151515 42%,
      #020202 100%
    );

  font-family: sans-serif;
}

/* ========================================
   パチスロ筐体本体
======================================== */

.slot-cabinet {
  position: relative;

  width: min(var(--cabinet-width), calc(100vw - 20px));
  aspect-ratio: 370 / 720;

  padding: 14px 17px 17px;

  border-radius: 31px 31px 18px 18px;

  background:
    linear-gradient(
      90deg,
      #111 0%,
      #686868 2%,
      #ededed 3.5%,
      #686868 5%,
      #151515 8%,
      #050505 14%,
      #171717 50%,
      #050505 86%,
      #151515 92%,
      #686868 95%,
      #ededed 96.5%,
      #686868 98%,
      #111 100%
    );

  border:
    3px solid var(--gold);

  box-shadow:
    0 0 0 3px #332900,
    0 0 24px rgba(255, 214, 52, 0.45),
    0 22px 32px rgba(0, 0, 0, 0.9),
    inset 0 0 24px #000,
    inset 8px 0 10px rgba(255,255,255,0.13),
    inset -8px 0 10px rgba(255,255,255,0.08);
}

/* 外周金枠 */

.slot-cabinet::before {
  content: "";

  position: absolute;
  inset: 8px;

  pointer-events: none;

  border:
    2px solid var(--gold);

  border-radius: 24px 24px 13px 13px;

  box-shadow:
    0 0 7px rgba(255, 220, 75, 0.55),
    inset 0 0 4px rgba(255, 220, 75, 0.4);
}

/* ガラス風ハイライト */

.slot-cabinet::after {
  content: "";

  position: absolute;
  z-index: 30;

  top: 21px;
  left: 21px;

  width: 2px;
  height: calc(100% - 47px);

  pointer-events: none;

  border-radius: 10px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(255,255,255,0.82),
      rgba(255,255,255,0.1),
      transparent
    );

  opacity: 0.68;
}

/* ========================================
   サイドランプ外装
======================================== */

.side-rail {
  position: absolute;
  z-index: 12;

  top: 64px;
  bottom: 70px;

  width: 12px;

  border:
    1px solid #7d6818;

  border-radius: 8px;

  background:
    linear-gradient(
      90deg,
      #191300,
      #ddbd34 30%,
      #fff1a0 50%,
      #b28c12 73%,
      #1a1400
    );

  box-shadow:
    0 0 6px rgba(255, 215, 57, 0.52),
    inset 0 0 4px #fff2a3;
}

.side-rail::after {
  content: "";

  position: absolute;
  inset: 3px;

  border-radius: inherit;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.75) 0 4px,
      rgba(107,84,0,0.65) 4px 8px
    );

  opacity: 0.55;
}

.side-rail.left {
  left: 10px;
}

.side-rail.right {
  right: 10px;
}

/* ========================================
   上部ランプユニット
======================================== */

.top-light-unit {
  position: relative;
  z-index: 3;

  height: 24px;
  margin: 0 26px 9px;

  border:
    2px solid #4d3e07;

  border-radius: 13px;

  background:
    linear-gradient(
      to bottom,
      #302800,
      #ffe45c 35%,
      #8d7012 70%,
      #1c1700
    );

  box-shadow:
    0 0 7px rgba(255, 216, 49, 0.55),
    inset 0 2px 3px rgba(255,255,255,0.7),
    inset 0 -3px 4px rgba(0,0,0,0.75);
}

/* ========================================
   共通ユニットフレーム
======================================== */

.unit {
  position: relative;
  z-index: 2;

  margin-bottom: 8px;

  border:
    2px solid #80691e;

  border-radius: 12px;

  background:
    linear-gradient(
      145deg,
      #303030,
      #090909 30%,
      #171717 70%,
      #020202
    );

  box-shadow:
    inset 0 0 0 2px #000,
    inset 0 4px 7px rgba(255,255,255,0.07),
    0 3px 7px rgba(0,0,0,0.85);
}

/* ========================================
   上部化粧パネル
======================================== */

.upper-decoration {
  height: 87px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      ellipse at center,
      #272727,
      #070707 66%
    );
}

.blank-panel {
  width: calc(100% - 28px);
  height: 55px;

  border:
    2px solid #4d4d4d;

  border-radius: 8px;

  background:
    linear-gradient(
      160deg,
      #191919,
      #050505 55%,
      #111
    );

  box-shadow:
    inset 0 0 13px #000,
    0 0 0 2px #050505;
}

/* ========================================
   上部表示機器取付スペース
======================================== */

.display-bay {
  height: 126px;
  padding: 11px;
}

.mounting-frame {
  width: 100%;
  height: 100%;

  padding: 8px;

  border:
    2px solid #868686;

  border-radius: 9px;

  background:
    linear-gradient(
      135deg,
      #efefef,
      #454545 10%,
      #111 37%,
      #888 75%,
      #202020
    );

  box-shadow:
    inset 0 0 5px #000,
    0 2px 5px #000;
}

.empty-display {
  width: 100%;
  height: 100%;

  border:
    4px solid #060606;

  border-radius: 5px;

  background:
    radial-gradient(
      ellipse at center,
      #171b1d,
      #050606 72%,
      #000
    );

  box-shadow:
    inset 0 0 20px #000,
    inset 0 0 4px #5d6970;
}

/* ========================================
   リールユニット取付スペース
======================================== */

.reel-bay {
  height: 175px;
  padding: 12px 11px;
}

.reel-metal-frame {
  width: 100%;
  height: 100%;

  padding: 9px;

  border:
    2px solid #8e8e8e;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #f0f0f0,
      #555 11%,
      #171717 40%,
      #949494 76%,
      #242424
    );

  box-shadow:
    inset 0 0 7px #000,
    0 3px 6px #000;
}

.empty-reel-window {
  position: relative;

  width: 100%;
  height: 100%;

  border:
    5px solid #070707;

  border-radius: 6px;

  background:
    linear-gradient(
      to bottom,
      #050505,
      #171717 16%,
      #080808 84%,
      #000
    );

  box-shadow:
    inset 0 10px 15px #000,
    inset 0 -10px 15px #000;
}

/* リール取付位置を示す仕切りだけ */

.reel-mount-divider {
  position: absolute;

  top: 10px;
  bottom: 10px;

  width: 2px;

  background:
    linear-gradient(
      to right,
      #000,
      #686868,
      #000
    );

  opacity: 0.55;
}

.reel-mount-divider.one {
  left: 33.333%;
}

.reel-mount-divider.two {
  left: 66.666%;
}

/* ========================================
   表示パネル取付スペース
======================================== */

.counter-bay {
  height: 70px;
  padding: 9px 10px;
}

.counter-mounts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;

  height: 100%;
}

.counter-slot {
  border:
    1px solid #826a1c;

  border-radius: 5px;

  background:
    linear-gradient(
      #141414,
      #030303
    );

  box-shadow:
    inset 0 0 7px #000;
}

/* ========================================
   操作ユニット取付スペース
======================================== */

.control-bay {
  height: 147px;
  padding: 11px;
}

.control-surface {
  position: relative;

  width: 100%;
  height: 100%;

  border:
    2px solid #222;

  border-radius: 10px 10px 16px 16px;

  background:
    linear-gradient(
      170deg,
      #4b4b4b 0%,
      #181818 15%,
      #090909 58%,
      #1d1d1d 100%
    );

  box-shadow:
    inset 0 4px 5px rgba(255,255,255,0.12),
    inset 0 -7px 9px #000,
    0 3px 6px #000;
}

/* ボタン穴 */

.button-hole {
  position: absolute;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #030303 0%,
      #080808 55%,
      #4f4f4f 58%,
      #111 72%
    );

  box-shadow:
    inset 0 0 8px #000,
    0 1px 2px rgba(255,255,255,0.25);
}

.button-hole.small {
  top: 15px;

  width: 36px;
  height: 36px;
}

.button-hole.small.one {
  left: 82px;
}

.button-hole.small.two {
  left: 50%;
  transform: translateX(-50%);
}

.button-hole.small.three {
  right: 82px;
}

.button-hole.stop {
  bottom: 14px;

  width: 61px;
  height: 61px;
}

.button-hole.stop.one {
  left: 80px;
}

.button-hole.stop.two {
  left: 50%;
  transform: translateX(-50%);
}

.button-hole.stop.three {
  right: 80px;
}

/* レバー取付穴 */

.lever-hole {
  position: absolute;

  left: 18px;
  bottom: 21px;

  width: 48px;
  height: 48px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #020202 0 40%,
      #494949 43%,
      #111 70%
    );

  box-shadow:
    inset 0 0 7px #000,
    0 2px 3px #000;
}

/* コイン投入口取付穴 */

.medal-slot-hole {
  position: absolute;

  top: 26px;
  right: 18px;

  width: 39px;
  height: 8px;

  border:
    2px solid #555;

  border-radius: 5px;

  background: #000;

  box-shadow:
    inset 0 0 4px #000,
    0 1px 1px #aaa;
}

/* ========================================
   下部化粧パネル
======================================== */

lower-panel,
.lower-panel {
  height: 92px;
  padding: 10px;
}

.lower-blank-panel {
  width: 100%;
  height: 100%;

  border:
    2px solid #353535;

  border-radius: 7px;

  background:
    radial-gradient(
      ellipse at center,
      #171717,
      #050505 70%
    );

  box-shadow:
    inset 0 0 15px #000;
}

/* スピーカー穴 */

.speaker {
  position: absolute;
  z-index: 5;

  bottom: 74px;

  width: 35px;
  height: 35px;

  border:
    2px solid #3d3d3d;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #000 0 2px,
      transparent 2px 4px
    ),
    #151515;

  background-size: 6px 6px;

  box-shadow:
    inset 0 0 7px #000,
    0 1px 2px #666;
}

.speaker.left {
  left: 16px;
}

.speaker.right {
  right: 16px;
}

/* ========================================
   メダル払出口・下皿
======================================== */

tray-section,
.tray-section {
  position: relative;
  z-index: 2;

  height: 96px;

  padding: 9px 13px;

  border:
    2px solid #292929;

  border-radius: 7px 7px 14px 14px;

  background:
    linear-gradient(
      to bottom,
      #696969,
      #252525 18%,
      #070707 52%,
      #171717
    );

  box-shadow:
    inset 0 3px 5px rgba(255,255,255,0.14),
    inset 0 -5px 8px #000,
    0 4px 7px #000;
}

.payout-opening {
  width: 110px;
  height: 22px;

  margin: 0 auto 7px;

  border:
    3px solid #555;

  border-radius: 4px 4px 11px 11px;

  background: #020202;

  box-shadow:
    inset 0 5px 8px #000,
    0 1px 2px rgba(255,255,255,0.28);
}

.medal-tray {
  height: 51px;

  border:
    2px solid #535353;

  border-radius: 5px 5px 13px 13px;

  background:
    radial-gradient(
      ellipse at center bottom,
      #252525,
      #070707 72%
    );

  box-shadow:
    inset 0 8px 12px #000,
    inset 0 -3px 4px rgba(255,255,255,0.1);
}

/* ========================================
   底部
======================================== */

.machine-base {
  height: 10px;

  margin: 7px 22px -8px;

  border-radius: 0 0 9px 9px;

  background:
    linear-gradient(
      to bottom,
      #5e5e5e,
      #090909
    );

  box-shadow:
    0 5px 7px #000;
}

/* ========================================
   スマートフォン調整
======================================== */

@media (max-height: 760px) and (min-width: 340px) {
  body {
    align-items: flex-start;
  }

  .slot-cabinet {
    transform-origin: top center;
  }
}

@media (max-width: 350px) {
  .button-hole.stop.one {
    left: 70px;
  }

  .button-hole.stop.three {
    right: 70px;
  }

  .button-hole.small.one {
    left: 71px;
  }

  .button-hole.small.three {
    right: 71px;
  }
}
</style>
</head>

<body>

<div class="slot-cabinet">

  <div class="side-rail left"></div>
  <div class="side-rail right"></div>

  <div class="top-light-unit"></div>

  <!-- 上部化粧板 -->
  <section class="unit upper-decoration">
    <div class="blank-panel"></div>
  </section>

  <!-- 液晶などを取り付ける空間 -->
  <section class="unit display-bay">
    <div class="mounting-frame">
      <div class="empty-display"></div>
    </div>
  </section>

  <!-- リールユニットを取り付ける空間 -->
  <section class="unit reel-bay">
    <div class="reel-metal-frame">
      <div class="empty-reel-window">
        <div class="reel-mount-divider one"></div>
        <div class="reel-mount-divider two"></div>
      </div>
    </div>
  </section>

  <!-- クレジット表示機器などの取付穴 -->
  <section class="unit counter-bay">
    <div class="counter-mounts">
      <div class="counter-slot"></div>
      <div class="counter-slot"></div>
      <div class="counter-slot"></div>
    </div>
  </section>

  <!-- 操作機器取付板 -->
  <section class="unit control-bay">
    <div class="control-surface">

      <div class="button-hole small one"></div>
      <div class="button-hole small two"></div>
      <div class="button-hole small three"></div>

      <div class="lever-hole"></div>

      <div class="button-hole stop one"></div>
      <div class="button-hole stop two"></div>
      <div class="button-hole stop three"></div>

      <div class="medal-slot-hole"></div>

    </div>
  </section>

  <!-- 下部パネル -->
  <section class="unit lower-panel">
    <div class="speaker left"></div>
    <div class="speaker right"></div>
    <div class="lower-blank-panel"></div>
  </section>

  <!-- 払出口・下皿 -->
  <section class="tray-section">
    <div class="payout-opening"></div>
    <div class="medal-tray"></div>
  </section>

  <div class="machine-base"></div>

</div>

</body>
</html>
