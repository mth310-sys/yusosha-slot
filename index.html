<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#060204">
  <title>テラフォーマーズ スロット | 遊創舎</title>
  <style>
    /* =============================================
       [0] リセット・基盤
    ============================================= */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html { height: 100%; background: #040103; overflow-x: hidden; }
    body {
      min-height: 100%;
      background: radial-gradient(ellipse at center, #1a0608 0%, #040103 100%);
      display: flex; justify-content: center; align-items: flex-start;
      font-family: 'Courier New', 'Lucida Console', monospace;
      overflow-x: hidden;
    }

    /* =============================================
       [1] Canvas オーバーレイ
    ============================================= */
    #effectCanvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 9000;
    }

    /* =============================================
       [2] 筐体
    ============================================= */
    #cabinet {
      width: 390px; min-height: 100vh; position: relative;
      background: linear-gradient(175deg, #1a0808 0%, #0a0304 35%, #120608 65%, #1c0a0a 100%);
      border-left: 3px solid #6b0e08; border-right: 3px solid #6b0e08;
      overflow: hidden;
      box-shadow:
        -6px 0 20px rgba(160, 30, 10, 0.30),
         6px 0 20px rgba(160, 30, 10, 0.30),
        inset 0 0 60px rgba(0,0,0,0.55);
    }
    #cabinet::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent 0px, transparent 3px,
        rgba(255,255,255,0.012) 3px, rgba(255,255,255,0.012) 4px
      );
      pointer-events: none; z-index: 0;
    }
    #cabinet > * { position: relative; z-index: 1; }
    #cabinet.cabinet-flash { animation: cabinetFlash 0.28s ease-in-out 8; }
    @keyframes cabinetFlash {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.6) saturate(1.5); }
    }

    /* =============================================
       [3] フレームランプ（最上部）
    ============================================= */
    .frame-lamp {
      height: 6px;
      background: linear-gradient(to right, #5a0000, #cc1800, #ff4400, #cc1800, #ff2200, #cc1800, #5a0000);
      animation: framePulseNormal 1.4s ease-in-out infinite;
    }
    .frame-lamp.mode-at {
      height: 8px;
      animation: framePulseAt 0.25s steps(1) infinite;
    }
    .frame-lamp.mode-bonus {
      height: 8px;
      animation: framePulseBonus 0.12s steps(1) infinite;
    }
    @keyframes framePulseNormal {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; filter: brightness(1.6); }
    }
    @keyframes framePulseAt {
      0%   { background: #ff0000; }
      14%  { background: #ff6600; }
      28%  { background: #ffcc00; }
      42%  { background: #ff0066; }
      57%  { background: #cc00ff; }
      71%  { background: #0088ff; }
      85%  { background: #00ff88; }
    }
    @keyframes framePulseBonus {
      0%   { background: #ff0000; }
      33%  { background: #ff8800; }
      66%  { background: #ffdd00; }
    }

    /* =============================================
       [4] 上部 LED ストリップ
    ============================================= */
    .top-led-strip {
      display: flex; justify-content: center; align-items: center;
      gap: 5px; padding: 8px 20px 6px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
    }
    .led-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .led-dot.red {
      background: #ff2200;
      box-shadow: 0 0 5px #ff2200, 0 0 10px rgba(255,34,0,0.5);
      animation: ledPulse 1.6s ease-in-out infinite;
    }
    .led-dot.amber {
      background: #ff8800;
      box-shadow: 0 0 5px #ff8800, 0 0 10px rgba(255,136,0,0.5);
      animation: ledPulse 1.6s ease-in-out infinite;
    }
    .led-dot:nth-child(odd)  { animation-delay: 0s; }
    .led-dot:nth-child(even) { animation-delay: 0.8s; }
    @keyframes ledPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.18; transform: scale(0.68); }
    }

    /* =============================================
       [5] マシン ヘッダー
    ============================================= */
    .machine-header {
      text-align: center; padding: 4px 20px 8px; position: relative; cursor: pointer;
    }
    .machine-header::before, .machine-header::after {
      content: ''; position: absolute; top: 50%; transform: translateY(-50%);
      width: 20%; height: 1px;
      background: linear-gradient(to right, transparent, #8b2000 60%, #ff3300 100%);
    }
    .machine-header::before { left: 4%; }
    .machine-header::after  { right: 4%; transform: translateY(-50%) scaleX(-1); }
    .machine-name {
      font-size: 19px; font-weight: 900; letter-spacing: 5px;
      color: #ff3300;
      text-shadow:
        0 0 10px rgba(255,50,0,0.95),
        0 0 28px rgba(200,20,0,0.55),
        0 2px 4px rgba(0,0,0,0.95);
      font-family: 'Arial Black', 'Impact', sans-serif;
    }
    .machine-subtitle {
      font-size: 7px; letter-spacing: 3px; color: #5a1a08;
      margin-top: 3px; text-transform: uppercase;
    }

    /* =============================================
       [6] LCD パネル
    ============================================= */
    .lcd-panel {
      margin: 2px 8px 6px;
      background: #02040c;
      border: 2px solid #2a0e06;
      border-radius: 8px;
      padding: 7px 10px 6px;
      position: relative;
      height: 116px;
      overflow: hidden;
      box-shadow:
        inset 0 0 35px rgba(0,0,0,0.98),
        0 0 12px rgba(160,50,0,0.18),
        0 3px 10px rgba(0,0,0,0.8);
    }
    .lcd-panel::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none; z-index: 5; border-radius: 6px;
    }
    .lcd-panel::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 32%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.035) 0%, transparent 100%);
      border-radius: 6px 6px 0 0; pointer-events: none; z-index: 6;
    }
    .lcd-content { position: relative; z-index: 4; height: 100%; display: flex; flex-direction: column; }

    .lcd-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1e0c04; padding-bottom: 4px; margin-bottom: 5px;
    }
    .lcd-mode-tag {
      font-size: 8px; letter-spacing: 2px; color: #cc3300;
      background: rgba(160,30,0,0.18); padding: 1px 6px;
      border: 1px solid #3a0e00; border-radius: 2px;
    }
    .lcd-year { font-size: 8px; color: #2e1408; letter-spacing: 2px; }

    .lcd-main {
      text-align: center; font-size: 16px; font-weight: bold; letter-spacing: 3px;
      color: #ff6622;
      text-shadow: 0 0 9px rgba(255,100,0,0.75), 0 0 20px rgba(200,60,0,0.35);
      min-height: 24px; transition: opacity 0.15s;
    }
    .lcd-main.flash { animation: lcdFlash 0.3s ease-out; }
    @keyframes lcdFlash {
      0% { opacity: 0; transform: scaleX(1.06); }
      100% { opacity: 1; transform: scaleX(1); }
    }
    .lcd-sub {
      text-align: center; font-size: 9px; letter-spacing: 1px;
      color: #7a3010; margin-top: 3px; min-height: 14px;
    }

    .lcd-at-bar {
      display: none; align-items: center; gap: 6px;
      margin-top: 6px; padding-top: 5px; border-top: 1px solid #1e0c04;
    }
    .lcd-at-bar.visible { display: flex; }
    .lcd-at-label { font-size: 8px; color: #ff3300; letter-spacing: 1px; white-space: nowrap; }
    .lcd-at-gauge {
      flex: 1; height: 7px; background: #080204;
      border: 1px solid #2a0800; border-radius: 4px; overflow: hidden;
    }
    .lcd-at-fill {
      height: 100%;
      background: linear-gradient(to right, #aa1800, #ff4400, #ff8800);
      border-radius: 4px; transition: width 0.35s ease;
      box-shadow: 0 0 5px rgba(255,80,0,0.6);
    }
    .lcd-at-count {
      font-size: 12px; font-weight: bold; color: #ff6622; white-space: nowrap;
      text-shadow: 0 0 5px rgba(255,100,0,0.7);
      min-width: 36px; text-align: right;
    }

    /* =============================================
       [7] リールエリア全体
    ============================================= */
    .reel-area {
      display: flex; align-items: stretch;
      padding: 0 8px; gap: 4px; margin-bottom: 5px;
    }

    /* =============================================
       [8] サイドパネル・PEKAランプ
    ============================================= */
    .side-panel {
      width: 18px; display: flex; flex-direction: column;
      align-items: center; gap: 5px; padding: 8px 0; flex-shrink: 0;
    }
    .peka-lamp {
      width: 14px; height: 30px; border-radius: 4px;
      background: radial-gradient(circle at 50% 40%, #1c0400 30%, #0a0200 100%);
      border: 1px solid #380800; box-shadow: 0 0 3px rgba(0,0,0,0.9);
      transition: background 0.07s, box-shadow 0.07s, border-color 0.07s;
      flex-shrink: 0;
    }
    .peka-lamp.lit {
      background: radial-gradient(circle at 50% 35%, #ffffff 15%, #ff7733 50%, #cc2200 100%);
      border-color: #ff4400;
      box-shadow: 0 0 9px #ff6600, 0 0 22px #ff3300, 0 0 44px rgba(255,80,0,0.65);
      animation: pekaFlash 0.12s ease-in-out infinite alternate;
    }
    @keyframes pekaFlash {
      from { box-shadow: 0 0 9px #ff6600, 0 0 22px #ff3300, 0 0 44px rgba(255,80,0,0.65); }
      to   { box-shadow: 0 0 18px #ffffff, 0 0 38px #ff6600, 0 0 72px rgba(255,130,0,0.90); }
    }
    .side-led { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .side-led.red {
      background: #ff2200;
      box-shadow: 0 0 4px #ff2200, 0 0 8px rgba(255,34,0,0.4);
      animation: sideLed 2.0s ease-in-out infinite;
    }
    .side-led.amber {
      background: #ff7700;
      box-shadow: 0 0 4px #ff7700, 0 0 8px rgba(255,120,0,0.4);
      animation: sideLed 2.0s ease-in-out infinite;
    }
    .side-led.at-red {
      background: #ff0044;
      box-shadow: 0 0 6px #ff0044, 0 0 14px rgba(255,0,60,0.6);
      animation: sideLedAt 0.3s ease-in-out infinite alternate;
    }
    .side-panel.left  .side-led:nth-child(odd)  { animation-delay: 0.0s; }
    .side-panel.left  .side-led:nth-child(even) { animation-delay: 1.0s; }
    .side-panel.right .side-led:nth-child(odd)  { animation-delay: 0.5s; }
    .side-panel.right .side-led:nth-child(even) { animation-delay: 1.5s; }
    @keyframes sideLed    { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }
    @keyframes sideLedAt  { from { opacity: 0.3; } to { opacity: 1; } }

    /* =============================================
       [9] リール窓フレーム
    ============================================= */
    .reel-frame {
      flex: 1; position: relative; border-radius: 10px;
      background: linear-gradient(145deg, #200c0c 0%, #0c0404 50%, #180808 100%);
      padding: 3px;
      border: 2px solid transparent; outline: 1px solid #280800;
      box-shadow:
        0 6px 30px rgba(0,0,0,0.98),
        inset 0 1px 3px rgba(255,255,255,0.055),
        inset 0 -1px 3px rgba(0,0,0,0.7);
    }
    .reel-frame::before {
      content: ''; position: absolute; inset: -2px; border-radius: 12px;
      background: linear-gradient(145deg, #8b0e00 0%, #cc2800 30%, #4a0600 50%, #cc2800 70%, #8b0e00 100%);
      z-index: -1;
    }
    .reel-frame::after {
      content: ''; position: absolute; top: 4px; left: 4px; right: 4px; height: 28%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, transparent 100%);
      border-radius: 8px 8px 0 0; pointer-events: none; z-index: 8;
    }
    .reel-frame-inner {
      background: #030203; border-radius: 8px; padding: 10px 8px; position: relative;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.98);
    }
    .reel-frame-inner::before {
      content: ''; position: absolute; inset: 0; border-radius: 8px;
      background: radial-gradient(ellipse at 50% 65%, rgba(160,30,0,0.07) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* =============================================
       [10] 当選ライン
    ============================================= */
    .win-line {
      position: absolute; left: 6px; right: 6px; top: 118px; height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255,80,0,0.35) 15%,
        rgba(255,100,0,0.65) 50%,
        rgba(255,80,0,0.35) 85%,
        transparent
      );
      z-index: 9; pointer-events: none;
    }
    .win-line.active {
      animation: winLinePulse 0.45s ease-in-out infinite;
    }
    @keyframes winLinePulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 4px rgba(255,80,0,0.5); }
      50%       { opacity: 0.55; box-shadow: 0 0 14px rgba(255,140,0,0.9); }
    }

    /* =============================================
       [11] リールコンテナ・リール窓
    ============================================= */
    .reel-container { display: flex; gap: 5px; position: relative; z-index: 1; }
    .reel-window {
      flex: 1; height: 228px; overflow: hidden; position: relative;
      background: #020102; border-radius: 4px; border: 1px solid #180606;
      box-shadow: inset 0 0 28px rgba(0,0,0,0.98), inset 0 0 6px rgba(0,0,0,1);
    }
    .reel-window::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 44px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.52) 65%, transparent 100%);
      z-index: 6; pointer-events: none;
    }
    .reel-window::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 44px;
      background: linear-gradient(to top, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.52) 65%, transparent 100%);
      z-index: 6; pointer-events: none;
    }
    @keyframes reelStopFlash {
      0%   { box-shadow: inset 0 0 32px rgba(255,80,0,0.65), inset 0 0 6px rgba(0,0,0,1); border-color: #ff4400; }
      100% { box-shadow: inset 0 0 28px rgba(0,0,0,0.98), inset 0 0 6px rgba(0,0,0,1); border-color: #180606; }
    }
    .reel-window.flash-stop { animation: reelStopFlash 0.45s ease-out forwards; }
    .reel-scanline {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 5px, rgba(0,0,0,0.07) 5px, rgba(0,0,0,0.07) 6px);
      z-index: 5; pointer-events: none; border-radius: 4px;
    }
    .reel-tape { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }

    /* =============================================
       [12] シンボル
    ============================================= */
    .reel-sym {
      height: 76px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; line-height: 1; user-select: none; position: relative;
    }
    .sym-mars {
      font-size: 18px; font-weight: 900; color: #ff2200; letter-spacing: 0px;
      text-shadow:
        0 0 10px rgba(255,40,0,1),
        0 0 26px rgba(200,10,0,0.65),
        0 2px 3px rgba(0,0,0,0.98);
      font-family: 'Arial Black', 'Impact', sans-serif;
    }
    .sym-terra {
      font-size: 18px; font-weight: 900; color: #d0d0d0; letter-spacing: -1px;
      text-shadow:
        0 0 7px rgba(180,180,180,0.55),
        0 0 18px rgba(255,80,80,0.25),
        0 1px 2px rgba(0,0,0,0.98);
      font-family: 'Arial Black', 'Impact', sans-serif;
    }
    .sym-squad {
      font-size: 18px; font-weight: 900; color: #4488ff; letter-spacing: 0px;
      text-shadow: 0 0 8px rgba(60,130,255,0.75), 0 1px 2px rgba(0,0,0,0.95);
      font-family: 'Arial Black', 'Impact', sans-serif;
    }
    .sym-bugs {
      font-size: 14px; font-weight: 900; color: #44dd66; letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(60,200,80,0.75), 0 1px 2px rgba(0,0,0,0.95);
      font-family: 'Courier New', monospace;
    }
    .sym-rocket { font-size: 28px; filter: drop-shadow(0 0 4px rgba(180,200,255,0.5)); }
    .sym-moss   { font-size: 28px; filter: drop-shadow(0 0 3px rgba(60,160,60,0.45)); }
    .sym-g {
      font-size: 24px; font-weight: 900; color: #668833;
      text-shadow: 0 0 5px rgba(90,110,40,0.45), 0 1px 2px rgba(0,0,0,0.95);
      font-family: 'Arial Black', 'Impact', sans-serif;
    }

    /* =============================================
       [13] 情報表示パネル
    ============================================= */
    .info-panel {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 8px 4px;
      background: linear-gradient(to bottom, #0e0404 0%, #060202 50%, #0e0404 100%);
      border: 1px solid #2a0800; border-radius: 6px;
      padding: 7px 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.88), inset 0 1px 3px rgba(0,0,0,0.8);
    }
    .info-item { text-align: center; flex: 1; }
    .info-item + .info-item { border-left: 1px solid #1e0600; }
    .info-label { font-size: 8px; letter-spacing: 2px; color: #5a1a00; margin-bottom: 4px; }
    .info-value {
      font-size: 24px; font-weight: 900; color: #ff4400; letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255,80,0,0.85), 0 0 20px rgba(200,40,0,0.4);
      font-variant-numeric: tabular-nums;
    }
    @keyframes infoBlink {
      0%, 49% { opacity: 1; }
      50%, 100%{ opacity: 0; }
    }
    .info-value.blink { animation: infoBlink 0.36s steps(1) infinite; }

    /* =============================================
       [14] AT ストリップ
    ============================================= */
    .at-strip {
      margin: 0 8px 3px;
      background: linear-gradient(to right, #0a0204, #160608, #0a0204);
      border: 1px solid #380a00; border-radius: 4px;
      padding: 3px 10px;
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; height: 26px;
    }
    .at-strip.visible { opacity: 1; }
    .at-strip-label { font-size: 8px; letter-spacing: 2px; color: #ff3300; }
    .at-strip-count {
      font-size: 15px; font-weight: bold; color: #ff5522;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 6px rgba(255,90,0,0.7);
    }
    .at-strip-stock { font-size: 8px; color: #6a2000; }

    /* =============================================
       [15] ボタン行
    ============================================= */
    .button-row { display: flex; gap: 6px; padding: 4px 8px; }
    .main-buttons { gap: 8px; padding: 5px 10px; }
    .btn {
      flex: 1; border: none; cursor: pointer;
      font-family: 'Courier New', monospace; font-weight: 900;
      letter-spacing: 1px; border-radius: 8px; user-select: none;
      touch-action: manipulation; position: relative;
      transition: transform 0.07s, filter 0.07s;
      -webkit-appearance: none;
    }
    .btn:active:not(:disabled) { transform: translateY(3px) scale(0.97); filter: brightness(0.68); }
    .btn:disabled { opacity: 0.30; cursor: not-allowed; }
    .btn:disabled:active { transform: none; filter: none; }

    .btn-bet {
      height: 52px; font-size: 13px; color: #cc8866;
      background: linear-gradient(to bottom, #2e1008 0%, #1a0804 40%, #140602 60%, #241008 100%);
      box-shadow: 0 4px 0 #0a0200, 0 5px 8px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,150,100,0.10);
      border-top: 1px solid #4a1a08;
    }
    .btn-maxbet {
      height: 52px; font-size: 10px; color: #dd9933;
      background: linear-gradient(to bottom, #261808 0%, #160e02 40%, #100a00 60%, #1e1404 100%);
      box-shadow: 0 4px 0 #080400, 0 5px 8px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,180,60,0.08);
      border-top: 1px solid #3e2808;
    }
    .btn-start {
      height: 52px; font-size: 14px; color: #55cc33;
      background: linear-gradient(to bottom, #1a3808 0%, #0e1e04 40%, #0a1802 60%, #142e06 100%);
      box-shadow: 0 4px 0 #040c00, 0 5px 10px rgba(0,0,0,0.8), inset 0 1px 2px rgba(80,200,40,0.07), 0 0 12px rgba(60,160,0,0.2);
      border-top: 1px solid #2a5a10;
      text-shadow: 0 0 8px rgba(80,200,40,0.6);
    }
    .btn-start.ready {
      color: #88ff44;
      box-shadow: 0 4px 0 #040c00, 0 5px 10px rgba(0,0,0,0.8), inset 0 1px 2px rgba(80,200,40,0.07), 0 0 28px rgba(100,220,40,0.55);
      text-shadow: 0 0 14px rgba(130,255,60,0.95);
      animation: startPulse 1.0s ease-in-out infinite;
    }
    @keyframes startPulse {
      0%, 100% { box-shadow: 0 4px 0 #040c00, 0 0 12px rgba(80,200,20,0.35); }
      50%       { box-shadow: 0 4px 0 #040c00, 0 0 30px rgba(120,240,40,0.7); }
    }
    .btn-stop {
      height: 62px; font-size: 11px; line-height: 1.2; color: #bb4422;
      background: linear-gradient(to bottom, #2e0c08 0%, #1a0806 40%, #140604 60%, #241008 100%);
      box-shadow: 0 4px 0 #0c0200, 0 5px 8px rgba(0,0,0,0.82), inset 0 1px 2px rgba(255,80,40,0.08);
      border-top: 1px solid #481408;

<script>
'use strict';

/* =============================================
   [A] 定数・設定
============================================= */

const SYM_H   = 76;
const VISIBLE = 3;
const WINDOW_H = SYM_H * VISIBLE;  // 228px

const SYMBOLS = [
  { id: 'mars',   cls: 'sym-mars',   text: '火星'  },
  { id: 'terra',  cls: 'sym-terra',  text: 'テラ'  },
  { id: 'squad',  cls: 'sym-squad',  text: '隊員'  },
  { id: 'bugs',   cls: 'sym-bugs',   text: 'BUGS'  },
  { id: 'rocket', cls: 'sym-rocket', text: '🚀'    },
  { id: 'moss',   cls: 'sym-moss',   text: '苔'    },
  { id: 'g',      cls: 'sym-g',      text: 'Ｇ'    },
];

const N             = SYMBOLS.length;        // 7
const LOOP_H        = N * SYM_H;             // 532px
const COPIES        = 8;
const TAPE_H        = LOOP_H * COPIES;       // 4256px
const SPIN_SPEED    = 14;
const DECEL_ALPHA   = 0.055;
const DECEL_DIST    = SPIN_SPEED / DECEL_ALPHA;
const EXTRA_LOOPS   = 2;
const WRAP_THRESHOLD = LOOP_H * (COPIES - EXTRA_LOOPS - 2);

// シンボルID → インデックス
const SYM_IDX = {};
SYMBOLS.forEach((s, i) => { SYM_IDX[s.id] = i; });

// 配当テーブル（中段ラインのみ）
const PAY_TABLE = {
  'mars-mars-mars':      { pay: 0,  name: 'TERRA JACKPOT!!', type: 'big'    },
  'terra-terra-terra':   { pay: 0,  name: 'MISSION BONUS',   type: 'reg'    },
  'squad-squad-squad':   { pay: 15, name: 'SQUAD ALL OUT',   type: 'small'  },
  'bugs-bugs-bugs':      { pay: 10, name: 'BUGS COMPLETE',   type: 'small'  },
  'rocket-rocket-rocket':{ pay:  8, name: 'LAUNCH!!',        type: 'small'  },
  'moss-moss-moss':      { pay:  5, name: 'OVERGROWTH',      type: 'small'  },
  'g-g-g':               { pay:  5, name: 'G SWARM',         type: 'small'  },
  'squad-squad':         { pay:  2, name: 'COMBAT READY',    type: 'cherry' },
  'squad':               { pay:  1, name: 'STANDBY',         type: 'cherry' },
};

// 確率テーブル（/65536 カウント）
const PROB_NORMAL = {
  1: { big: 164,  reg: 218,  at: 655,  ch2: 1500, ch1: 3000 },
  2: { big: 182,  reg: 240,  at: 720,  ch2: 1650, ch1: 3200 },
  3: { big: 204,  reg: 273,  at: 800,  ch2: 1800, ch1: 3500 },
  4: { big: 234,  reg: 310,  at: 910,  ch2: 2000, ch1: 3800 },
  5: { big: 273,  reg: 365,  at: 1040, ch2: 2200, ch1: 4100 },
  6: { big: 327,  reg: 437,  at: 1200, ch2: 2500, ch1: 4500 },
};

// AT中の確率（高め）
const PROB_AT = {
  1: { big: 220,  reg: 327,  at: 0, ch2: 5000, ch1: 8000 },
  2: { big: 240,  reg: 360,  at: 0, ch2: 5500, ch1: 8500 },
  3: { big: 270,  reg: 400,  at: 0, ch2: 6000, ch1: 9000 },
  4: { big: 310,  reg: 460,  at: 0, ch2: 6500, ch1: 9500 },
  5: { big: 360,  reg: 540,  at: 0, ch2: 7200, ch1: 10500 },
  6: { big: 437,  reg: 655,  at: 0, ch2: 8000, ch1: 12000 },
};

const BONUS_PARAMS = {
  big: { payout: 240, name: 'TERRA BONUS',   sub: '討伐成功！大当たり！', atGiftMin: 30, atGiftMax: 60 },
  reg: { payout:  80, name: 'MISSION BONUS', sub: '任務完了',             atGiftMin: 0,  atGiftMax: 10 },
};

/* =============================================
   [B] ユーティリティ
============================================= */

function pad(n, len = 3) { return String(n).padStart(len, '0'); }
function rand(n)          { return Math.floor(Math.random() * n); }
function randExcept(exclude) {
  let r;
  do { r = rand(N); } while (r === exclude);
  return r;
}

/* =============================================
   [C] Reel クラス
============================================= */

class Reel {
  constructor(tapeEl, windowEl) {
    this.tape      = tapeEl;
    this.win       = windowEl;
    this.pos       = 0;
    this.phase     = 'idle';
    this.result    = null;
    this.stopEnd   = 0;
    this.stopSpeed = 0;
    this.stopFast  = false;
    this.onStopped = null;
  }

  buildTape() {
    const frag = document.createDocumentFragment();
    for (let c = 0; c < COPIES; c++) {
      for (let s = 0; s < N; s++) {
        const div = document.createElement('div');
        div.className = `reel-sym ${SYMBOLS[s].cls}`;
        div.textContent = SYMBOLS[s].text;
        frag.appendChild(div);
      }
    }
    this.tape.appendChild(frag);
    this._applyTransform();
  }

  startSpin() {
    this.phase     = 'spinning';
    this.result    = null;
    this.onStopped = null;
  }

  requestStop(resultIndex) {
    if (this.phase !== 'spinning') return;
    this.result = resultIndex;

    const targetInLoop = ((resultIndex - 1 + N) % N) * SYM_H;
    const currentMod   = this.pos % LOOP_H;
    let dist = targetInLoop - currentMod;
    if (dist <= 0) dist += LOOP_H;
    dist += LOOP_H * EXTRA_LOOPS;

    this.stopEnd   = this.pos + dist;
    this.stopSpeed = SPIN_SPEED;
    this.stopFast  = (dist > DECEL_DIST);
    this.phase     = 'stopping';
  }

  update() {
    if (this.phase === 'idle' || this.phase === 'stopped') return;

    if (this.phase === 'spinning') {
      this.pos += SPIN_SPEED;
      if (this.pos >= WRAP_THRESHOLD) this.pos -= LOOP_H * (COPIES - EXTRA_LOOPS - 2);
      this._applyTransform();
      return;
    }

    // stopping
    const remain = this.stopEnd - this.pos;
    if (remain <= 0) {
      this.pos   = this.stopEnd;
      this.phase = 'stopped';
      this._applyTransform();
      if (this.onStopped) this.onStopped();
      return;
    }

    if (this.stopFast) {
      this.pos += SPIN_SPEED;
      if (this.stopEnd - this.pos <= DECEL_DIST) this.stopFast = false;
    } else {
      this.stopSpeed *= (1 - DECEL_ALPHA);
      this.pos += Math.max(this.stopSpeed, 1);
      if (this.stopSpeed < 1) {
        this.pos   = this.stopEnd;
        this.phase = 'stopped';
        this._applyTransform();
        if (this.onStopped) this.onStopped();
      }
    }
    this._applyTransform();
  }

  _applyTransform() {
    this.tape.style.transform = `translateY(${-(this.pos % TAPE_H)}px)`;
  }

  getResult() { return this.result !== null ? SYMBOLS[this.result] : null; }
}

/* =============================================
   [D] サウンド（Web Audio API）
============================================= */

let _audioCtx = null;
function getCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function tone(freq, type, dur, vol = 0.08) {
  try {
    const ctx = getCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function playSfx(type) {
  const T = (f, t, d, v) => tone(f, t, d, v);
  switch (type) {
    case 'bet':
      T(660, 'square', 0.05, 0.05); break;
    case 'start':
      T(440, 'sawtooth', 0.14, 0.07); break;
    case 'stop':
      T(330, 'square', 0.09, 0.07); break;
    case 'cherry':
      T(880, 'sine', 0.10, 0.08);
      setTimeout(() => T(1100, 'sine', 0.10, 0.08), 90);
      break;
    case 'win':
      [523,659,784,1047].forEach((f,i) => setTimeout(() => T(f,'sine',0.18,0.10), i*80));
      break;
    case 'bonus':
      [523,659,784,880,1047,1319].forEach((f,i) => setTimeout(() => T(f,'square',0.25,0.12), i*80));
      break;
    case 'jackpot':
      [523,784,1047,1319,1568].forEach((f,i) => {
        setTimeout(() => T(f,'sawtooth',0.30,0.14), i*60);
        setTimeout(() => T(f*2,'sine',0.18,0.10), i*60+30);
      });
      break;
    case 'at_start':
      [440,550,660,880,1100].forEach((f,i) => setTimeout(() => T(f,'square',0.22,0.10), i*110));

    case 'nav_ok':
      T(1100, 'sine', 0.07, 0.06); break;
    case 'nav_ng':
      T(110, 'sawtooth', 0.12, 0.07); break;
  }
}

   [I] 内部抽選

function drawFlag() {
  const tbl = (game.mode === 'at') ? PROB_AT[game.setting] : PROB_NORMAL[game.setting];
  const r   = Math.floor(Math.random() * 65536);
  let acc = 0;
  acc += tbl.big; if (r < acc) return 'big';
  acc += tbl.reg; if (r < acc) return 'reg';
  acc += tbl.at;  if (r < acc) return 'at';
  acc += tbl.ch2; if (r < acc) return 'ch2';
  acc += tbl.ch1; if (r < acc) return 'ch1';
  return null;
}

function calcStops(flag) {
  switch (flag) {
    case 'big':  return [SYM_IDX.mars,  SYM_IDX.mars,  SYM_IDX.mars];
    case 'reg':  return [SYM_IDX.terra, SYM_IDX.terra, SYM_IDX.terra];
    case 'ch2':  return [SYM_IDX.squad, SYM_IDX.squad, randExcept(SYM_IDX.squad)];
    case 'ch1':  return [SYM_IDX.squad, randExcept(SYM_IDX.squad), randExcept(SYM_IDX.squad)];
    default:     return calcMissStops();
  }
}

function calcMissStops() {
  let r0, r1, r2, attempts = 0;
  do {
    r0 = rand(N); r1 = rand(N); r2 = rand(N);
    const k3 = `${SYMBOLS[r0].id}-${SYMBOLS[r1].id}-${SYMBOLS[r2].id}`;
    const k2 = `${SYMBOLS[r0].id}-${SYMBOLS[r1].id}`;
    const k1 = SYMBOLS[r0].id;
    if (!PAY_TABLE[k3] && !PAY_TABLE[k2] && !PAY_TABLE[k1]) break;
    attempts++;
  } while (attempts < 500);
  return [r0, r1, r2];
}

function startAt(bonus = 30) {
  if (game.mode === 'at') {
    game.atCount = Math.min(game.atCount + bonus, 999);
    game.atMax   = Math.max(game.atMax, game.atCount);
    showLcd('討伐RUSH', `討伐RUSH 延長！`, `+${bonus}G 追加`);
    setTimeout(() => showLcdAtState(), 2000);
  } else {
    game.mode     = 'at';
    game.atCount  = bonus;
    game.atMax    = bonus;
    game.totalAt++;
    setLampMode('at');
    document.getElementById('atStrip').classList.add('visible');
    setAtSideLeds();
    playSfx('at_start');
    showLcd('討伐RUSH', AT_START_MSGS[rand(AT_START_MSGS.length)][0], AT_START_MSGS[rand(AT_START_MSGS.length)][1]);
    setTimeout(showLcdAtState, 2500);
  }
  updateAtDisplay();
  updateStats();
  saveState();
}

function tickAt() {
  if (game.mode !== 'at') return;
  game.atCount--;
  updateAtDisplay();
  if (game.atCount <= 0) {
    if (game.atStock > 0) {
      game.atStock--;
      game.atCount = 30;
      game.atMax   = 30;
      updateAtDisplay();
      showLcd('討伐RUSH', 'ストック消化！', `残ストック: ${game.atStock}`);
      setTimeout(showLcdAtState, 2000);
    } else {
      endAt();
    }
  }
}

function endAt() {
  game.mode    = 'normal';
  game.atCount = 0;
  setLampMode('normal');
  document.getElementById('atStrip').classList.remove('visible');
  hidePushNav();
  hideLcdAtBar();
  showLcdCycle('NORMAL', NORMAL_MSGS);
  resetSideLeds();
}

function updateAtDisplay() {
  document.getElementById('atCount').textContent = game.atCount;
  document.getElementById('atStock').textContent = game.atStock;

}

function showLcdAtState() {

function startBonus(type) {
  game.atWasActive = (game.mode === 'at');
  if (game.mode === 'at') hidePushNav();
  game.mode    = type;
  game.phase   = 'bonus';

  if (type === 'big') { game.totalBig++; } else { game.totalReg++; }

  const bp      = BONUS_PARAMS[type];
  const payout  = bp.payout;
  game.credit  += payout;
  game.payout   = payout;

  setLampMode('bonus');
  updateDisplay();
  updateStats();

  document.getElementById('baTitle').textContent  = 'BONUS START';
  document.getElementById('baName').textContent   = bp.name;
  document.getElementById('baSub').textContent    = bp.sub;
  document.getElementById('baPayout').textContent = `+${payout} MEDALS`;
  document.getElementById('bonusAnnounce').classList.add('show');

  playSfx(type === 'big' ? 'jackpot' : 'bonus');
  cabinet.classList.remove('cabinet-flash');
  requestAnimationFrame(() => {
    cabinet.classList.add('cabinet-flash');
    cabinet.addEventListener('animationend', () => cabinet.classList.remove('cabinet-flash'), { once: true });
  });
  const rect = cabinet.getBoundingClientRect();
  triggerWinEffect(rect, type === 'big' ? 'jackpot' : 'bonus');

  payoutDisplay.classList.add('blink');
  setTimeout(() => {
    document.getElementById('bonusAnnounce').classList.remove('show');
    payoutDisplay.classList.remove('blink');
    endBonus(type);
  }, 4000);

  saveState();
}

function endBonus(type) {
  const bp = BONUS_PARAMS[type];

  // BIG bonus: gift AT games
  const atGift = bp.atGiftMin + rand(bp.atGiftMax - bp.atGiftMin + 1);
  if (atGift > 0 || game.atWasActive) {
    game.mode = 'normal'; // reset so startAt treats it as new
    if (game.atWasActive && game.atCount > 0) {
      // Resume AT
      game.mode    = 'at';
      game.atCount = game.atCount; // kept
      setLampMode('at');
      document.getElementById('atStrip').classList.add('visible');
      setAtSideLeds();
    }
    if (atGift > 0) startAt(atGift);
    else if (game.mode !== 'at') { resetSideLeds(); setLampMode('normal'); }
  } else {
    game.mode = 'normal';
    setLampMode('normal');
    resetSideLeds();
    showLcdCycle('NORMAL', NORMAL_MSGS);
  }

  game.atWasActive = false;
  resetRound();
}

/* =============================================
   [L] プッシュ順ナビ
============================================= */

const pushNavEl  = document.getElementById('pushNav');
const pushNavSeq = document.getElementById('pushNavSeq');

function generatePushOrder() {
  const arr = [0, 1, 2];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  game.pushTarget = arr;
  game.pushDone   = [];
}

function showPushNav() {
  if (game.mode !== 'at') return;
  generatePushOrder();
  renderPushNav();
  pushNavEl.classList.add('visible');

  // Highlight next STOP button
  const nextStop = game.pushTarget[0];
  btnStops.forEach((b, i) => b.classList.toggle('nav-highlight', i === nextStop));
}

function renderPushNav() {
  pushNavSeq.innerHTML = '';
  const labels = ['①', '②', '③'];
  game.pushTarget.forEach((reelIdx, step) => {
    if (step > 0) {
      const arw = document.createElement('div');
      arw.className = 'push-nav-arrow'; arw.textContent = '→';
      pushNavSeq.appendChild(arw);
    }
    const el = document.createElement('div');
    el.className = 'push-nav-step';
    el.textContent = labels[reelIdx];
    const doneIdx = game.pushDone.indexOf(reelIdx);
    if (doneIdx !== -1) {
      el.classList.add('done');
    } else if (game.pushDone.length === step) {
      el.classList.add('next');
    }
    pushNavSeq.appendChild(el);
  });
}

function hidePushNav() {
  pushNavEl.classList.remove('visible');
  btnStops.forEach(b => b.classList.remove('nav-highlight'));
  game.pushTarget = [];
  game.pushDone   = [];
}

function checkPush(reelIndex) {
  if (game.mode !== 'at' || game.pushTarget.length === 0) return 'none';
  const expected = game.pushTarget[game.pushDone.length];
  game.pushDone.push(reelIndex);
  renderPushNav();

  // Highlight next button
  const nextStep = game.pushDone.length;
  if (nextStep < game.pushTarget.length) {
    const next = game.pushTarget[nextStep];
    btnStops.forEach((b, i) => b.classList.toggle('nav-highlight', i === next && !b.disabled));
  } else {
    btnStops.forEach(b => b.classList.remove('nav-highlight'));
  }

  if (expected === reelIndex) { playSfx('nav_ok'); return 'ok'; }
  playSfx('nav_ng'); return 'ng';
}

/* =============================================
   [N] ゲームロジック
============================================= */

function onBet() {
  if (game.phase !== 'idle') return;
  if (game.credit <= 0 || game.bet >= 3) return;
  game.bet++;
  game.credit--;
  playSfx('bet');
  updateDisplay();
}

function onMaxBet() {
  if (game.phase !== 'idle') return;
  const need = Math.min(3 - game.bet, game.credit);
  if (need <= 0) return;
  game.bet    += need;
  game.credit -= need;
  playSfx('bet');
  updateDisplay();
}

function onStart() {
  if (game.phase !== 'idle') return;
  if (game.bet <= 0) {
    btnBet.style.filter = 'brightness(2.5)';
    setTimeout(() => { btnBet.style.filter = ''; }, 280);
    return;
  }

  game.internalFlag  = drawFlag();
  game.plannedStops  = calcStops(game.internalFlag);
  game.phase         = 'spinning';
  game.payout        = 0;
  game.stoppedCount  = 0;
  game.totalGames++;

  updateDisplay();
  updateStats();

  btnBet.disabled    = true;
  btnMaxBet.disabled = true;
  btnStart.disabled  = true;
  btnStops.forEach(b => { b.disabled = false; b.classList.remove('nav-highlight','nav-correct','nav-wrong'); });

  if (game.mode === 'at') showPushNav();

  reels.forEach(r => r.startSpin());
  playSfx('start');

  const msg = SPIN_MSGS[rand(SPIN_MSGS.length)];
  showLcd('QUEST', msg[0], msg[1]);

  const rect = cabinet.getBoundingClientRect();
  triggerParticles(rect.left + rect.width / 2, rect.top + rect.height * 0.45, 14);

  autoStopTimer = setTimeout(() => {
    btnStops.forEach((b, i) => { if (!b.disabled) onStop(i); });
  }, 10000);
}

function onStop(reelIndex) {
  const reel = reels[reelIndex];
  if (reel.phase !== 'spinning') return;

  btnStops[reelIndex].disabled = true;
  btnStops[reelIndex].classList.remove('nav-highlight');

  const navResult = checkPush(reelIndex);

  // AT中 押し順ミス: ch2→ch1 に格下げ
  let planned = game.plannedStops[reelIndex];
  if (game.mode === 'at' && game.internalFlag === 'ch2' && navResult === 'ng' && reelIndex === 1) {
    planned = randExcept(SYM_IDX.squad);
    game.plannedStops[1] = planned;
  }

  reel.requestStop(planned);

  if (navResult === 'ok') btnStops[reelIndex].classList.add('nav-correct');
  if (navResult === 'ng') btnStops[reelIndex].classList.add('nav-wrong');
  playSfx('stop');

  reel.onStopped = () => {
    btnStops[reelIndex].classList.remove('nav-correct', 'nav-wrong');

    reel.win.classList.add('flash-stop');
    reel.win.addEventListener('animationend', () => reel.win.classList.remove('flash-stop'), { once: true });

    const wRect = reel.win.getBoundingClientRect();
    triggerSparks(wRect.left + wRect.width / 2, wRect.top + wRect.height / 2, 8);

    const bm = BATTLE_MSGS[rand(BATTLE_MSGS.length)];
    showLcd('BATTLE', bm[0], bm[1]);

    game.stoppedCount++;
    if (game.stoppedCount === 3) onAllStopped();
  };
}

function onAllStopped() {
  if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
  hidePushNav();
  game.phase = 'result';

  const r0 = reels[0].getResult();
  const r1 = reels[1].getResult();
  const r2 = reels[2].getResult();

  const key3 = `${r0.id}-${r1.id}-${r2.id}`;
  const key2 = `${r0.id}-${r1.id}`;
  const key1 = r0.id;

  const win = PAY_TABLE[key3] || PAY_TABLE[key2] || PAY_TABLE[key1] || null;

  if (win) {
    winLine.classList.add('active');

    if (win.type === 'big') {
      pekaLamp.classList.add('lit');
      setTimeout(() => {
        pekaLamp.classList.remove('lit');
        winLine.classList.remove('active');
        startBonus('big');
      }, 600);
      return;
    }
    if (win.type === 'reg') {
      pekaLamp.classList.add('lit');
      setTimeout(() => {
        pekaLamp.classList.remove('lit');
        winLine.classList.remove('active');
        startBonus('reg');
      }, 600);
      return;
    }

    // Regular / cherry wins
    const total = win.pay * game.bet;
    game.payout  = total;
    game.credit += total;
    updateDisplay();

    if (win.type === 'cherry') {
      playSfx('cherry');
    } else {
      playSfx('win');
      pekaLamp.classList.add('lit');
    }

    if (game.mode === 'at') {
      const wm = AT_WIN_MSGS[rand(AT_WIN_MSGS.length)];
      showLcd('討伐RUSH', wm[0], wm[1]);
    }

    showWin(win, total);

    // AT trigger check
    if (game.internalFlag === 'at') {
      setTimeout(() => startAt(), 2000);
    } else if (game.mode === 'at') {
      setTimeout(tickAt, 200);
    }

  } else {
    // No win
    winLine.classList.remove('active');

    if (game.internalFlag === 'at') {
      // AT triggers without visual win
      setTimeout(() => startAt(), 600);
    } else if (game.mode === 'at') {
      tickAt();
      if (game.mode === 'at') showLcdAtState();
      setTimeout(resetRound, 500);
    } else {
      showLcdCycle('NORMAL', NORMAL_MSGS);
      setTimeout(resetRound, 500);
    }
  }
}

function showWin(win, amount) {
  document.getElementById('wmAmount').textContent = amount;
  document.getElementById('wmName').textContent   = win.name;
  document.getElementById('winMessage').classList.add('show');

  payoutDisplay.classList.add('blink');

  cabinet.classList.remove('cabinet-flash');
  requestAnimationFrame(() => {
    cabinet.classList.add('cabinet-flash');
    cabinet.addEventListener('animationend', () => cabinet.classList.remove('cabinet-flash'), { once: true });
  });

  const rect = cabinet.getBoundingClientRect();
  if (win.type !== 'cherry') triggerWinEffect(rect, 'win');

  setTimeout(() => {
    document.getElementById('winMessage').classList.remove('show');
    pekaLamp.classList.remove('lit');
    winLine.classList.remove('active');
    payoutDisplay.classList.remove('blink');
    if (game.mode !== 'at') showLcdCycle('NORMAL', NORMAL_MSGS);
    resetRound();
  }, 3000);
}

function resetRound() {
  if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
  if (game.phase === 'bonus') return; // bonus handles its own reset
  game.phase = 'idle';
  game.bet   = 0;

  btnBet.disabled    = false;
  btnMaxBet.disabled = false;
  btnStart.disabled  = false;
  btnStops.forEach(b => { b.disabled = true; });

  if (game.credit <= 0) {
    game.credit = 50;
    showLcd('CREDIT', 'クレジット補充', '50枚');
    setTimeout(() => { if (game.mode !== 'at') showLcdCycle('NORMAL', NORMAL_MSGS); }, 2000);
  }

  updateDisplay();
  saveState();
}

      el.classList.add('at-red');
    });

}

buildSideLEDs('rightPanel', ['amber','red','amber','red','amber','red']);

/* =============================================
   [P] Canvas エフェクトシステム
============================================= */

const canvas = document.getElementById('effectCanvas');
const ctx    = canvas.getContext('2d');

(function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  });
})();

const sparks     = [];
const particles  = [];
const lightnings = [];

class Spark {
  constructor(x, y, hue) {
    this.x    = x; this.y = y;
    this.vx   = (Math.random() - 0.5) * 10;
    this.vy   = -(Math.random() * 6 + 2);
    this.life = 1;
    this.fade = 0.035 + Math.random() * 0.04;
    this.size = 1.5 + Math.random() * 2.0;
    const h   = (hue !== undefined) ? hue : (5 + Math.random() * 25); // red-orange
    this.col  = `hsl(${h},100%,65%)`;
  }
  update() { this.vy += 0.22; this.x += this.vx; this.y += this.vy; this.vx *= 0.96; this.life -= this.fade; }
  draw(c) {
    if (this.life <= 0) return;
    c.save(); c.globalAlpha = Math.max(0, this.life);
    c.fillStyle = this.col;
    c.beginPath(); c.arc(this.x, this.y, Math.max(0.1, this.size * this.life), 0, Math.PI * 2);
    c.fill(); c.restore();
  }
}

class Particle {
  constructor(x, y, col) {
    this.x    = x; this.y = y;
    this.vx   = (Math.random() - 0.5) * 5;
    this.vy   = (Math.random() - 0.5) * 5 - 1.5;
    this.life = 1;
    this.fade = 0.009 + Math.random() * 0.014;
    this.size = 5 + Math.random() * 9;
    this.col  = col || `hsl(${Math.random() * 30},100%,70%)`;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy -= 0.04; this.vx *= 0.99; this.size *= 0.993; this.life -= this.fade; }
  draw(c) {
    if (this.life <= 0 || this.size < 0.5) return;
    c.save(); c.globalAlpha = Math.max(0, this.life * 0.72);
    const g = c.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    g.addColorStop(0, this.col); g.addColorStop(1, 'transparent');
    c.fillStyle = g; c.beginPath(); c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    c.fill(); c.restore();
  }
}

class Lightning {
  constructor(x1, y1, x2, y2) {
    this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2;
    this.life = 1; this.fade = 0.08; this.pts = this._gen();
  }
  _gen() {
    const pts = [{ x: this.x1, y: this.y1 }];
    const steps = 8 + Math.floor(Math.random() * 5);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      pts.push({
        x: this.x1 + (this.x2 - this.x1) * t + (Math.random() - 0.5) * 45,
        y: this.y1 + (this.y2 - this.y1) * t + (Math.random() - 0.5) * 45,
      });
    }
    pts.push({ x: this.x2, y: this.y2 }); return pts;
  }
  update() { this.life -= this.fade; }
  draw(c) {
    if (this.life <= 0) return;
    c.save();
    c.globalAlpha = this.life * 0.45; c.strokeStyle = 'rgba(255,140,80,1)';
    c.lineWidth = 4; c.shadowColor = '#ff8844'; c.shadowBlur = 22;
    c.beginPath();
    this.pts.forEach((p, i) => (i === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y)));
    c.stroke();
    c.globalAlpha = this.life; c.strokeStyle = '#ffffff'; c.lineWidth = 1; c.shadowBlur = 6;
    c.stroke(); c.restore();
  }
}

function triggerSparks(x, y, count = 12, hue) {
  for (let i = 0; i < count; i++) sparks.push(new Spark(x, y, hue));
}
function triggerParticles(x, y, count = 20, col) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(
      x + (Math.random() - 0.5) * 180,
      y + (Math.random() - 0.5) * 80,
      col
    ));
  }
}
function triggerLightning(rect) {
  const x1 = rect.left + Math.random() * rect.width;
  const y1 = rect.top  + Math.random() * rect.height * 0.25;
  const x2 = rect.left + Math.random() * rect.width;
  const y2 = rect.top  + rect.height * (0.35 + Math.random() * 0.3);
  lightnings.push(new Lightning(x1, y1, x2, y2));
}
function triggerWinEffect(rect, style) {
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height * 0.38;
  const isJackpot = style === 'jackpot';
  const cnt = isJackpot ? 50 : 30;
  for (let i = 0; i < cnt; i++) {
    sparks.push(new Spark(cx + (Math.random() - 0.5) * rect.width * 0.75, cy + (Math.random() - 0.5) * 60));
  }
  for (let i = 0; i < (isJackpot ? 40 : 22); i++) {
    particles.push(new Particle(
      cx + (Math.random() - 0.5) * rect.width * 0.8,
      cy + (Math.random() - 0.5) * 80,
      `hsl(${Math.random() * 35},100%,70%)`
    ));
  }
  const ltCount = isJackpot ? 8 : 4;
  for (let i = 0; i < ltCount; i++) {
    setTimeout(() => { triggerLightning(rect); triggerLightning(rect); }, i * 220);
  }
}

function drawEffects() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  [particles, sparks, lightnings].forEach(arr => {
    for (let i = arr.length - 1; i >= 0; i--) {
      arr[i].update(); arr[i].draw(ctx);
      if (arr[i].life <= 0) arr.splice(i, 1);
    }
  });
}

/* =============================================
   [Q] 統計・localStorage
============================================= */

const SAVE_KEY = 'tf_slot_save';

function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      credit:     game.credit,
      totalGames: game.totalGames,
      totalBig:   game.totalBig,
      totalReg:   game.totalReg,
      totalAt:    game.totalAt,
      setting:    game.setting,
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    if (s.credit     !== undefined) game.credit     = s.credit;
    if (s.totalGames !== undefined) game.totalGames = s.totalGames;
    if (s.totalBig   !== undefined) game.totalBig   = s.totalBig;
    if (s.totalReg   !== undefined) game.totalReg   = s.totalReg;
    if (s.totalAt    !== undefined) game.totalAt    = s.totalAt;
    if (s.setting    !== undefined) game.setting    = s.setting;
  } catch(e) {}
}

   [R] 設定パネル
============================================= */

const SETTING_INFO = {
  1: 'BIG: 約1/400  REG: 約1/300  AT: 約1/100',
  2: 'BIG: 約1/360  REG: 約1/273  AT: 約1/91',
  3: 'BIG: 約1/321  REG: 約1/240  AT: 約1/82',
  4: 'BIG: 約1/280  REG: 約1/211  AT: 約1/72',
  5: 'BIG: 約1/240  REG: 約1/179  AT: 約1/63',
  6: 'BIG: 約1/200  REG: 約1/150  AT: 約1/55',
};

function buildSettingBtns() {
  const container = document.getElementById('settingBtns');
  for (let s = 1; s <= 6; s++) {
    const btn = document.createElement('button');
    btn.className = `sp-btn${s === game.setting ? ' active' : ''}`;
    btn.textContent = s;
    btn.addEventListener('click', () => {
      game.setting = s;
      document.getElementById('spInfo').textContent = SETTING_INFO[s];
      container.querySelectorAll('.sp-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === s));
      updateStats();
      saveState();
    });
    container.appendChild(btn);
  }
  document.getElementById('spInfo').textContent = SETTING_INFO[game.setting];
}
buildSettingBtns();

let settingsHoldTimer = null;
document.getElementById('machineHeader').addEventListener('pointerdown', () => {
  settingsHoldTimer = setTimeout(() => {
    document.getElementById('settingsPanel').classList.add('show');
  }, 3000);
});
['pointerup','pointercancel','pointerleave'].forEach(ev =>
  document.getElementById('machineHeader').addEventListener(ev, () => clearTimeout(settingsHoldTimer))
);
document.getElementById('spClose').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.remove('show');
});

/* =============================================
   [S] ボタンイベント
============================================= */

function addAction(el, fn) {
  el.addEventListener('click', fn);
  el.addEventListener('touchend', e => { e.preventDefault(); fn(); });
}

addAction(btnBet,    onBet);
addAction(btnMaxBet, onMaxBet);
addAction(btnStart,  onStart);
btnStops.forEach((b, i) => addAction(b, () => onStop(i)));

/* =============================================
   [T] メインループ
============================================= */

let lastTime = performance.now();
function mainLoop(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  reels.forEach(r => r.update(dt));
  drawEffects();
  requestAnimationFrame(mainLoop);
}

/* =============================================
   [U] 起動
============================================= */

loadState();
updateDisplay();
updateStats();
updateAtDisplay();
showLcdCycle('NORMAL', NORMAL_MSGS);
requestAnimationFrame(mainLoop);

</script>
