function roundedBoxGeometry(width, height, depth, radius = 0.12) {
  const shape = new THREE.Shape();

  const x = -width / 2;
  const y = -height / 2;

  shape.moveTo(x + radius, y);
  shape.lineTo(x + width - radius, y);
  shape.quadraticCurveTo(
    x + width,
    y,
    x + width,
    y + radius
  );

  shape.lineTo(x + width, y + height - radius);
  shape.quadraticCurveTo(
    x + width,
    y + height,
    x + width - radius,
    y + height
  );

  shape.lineTo(x + radius, y + height);
  shape.quadraticCurveTo(
    x,
    y + height,
    x,
    y + height - radius
  );

  shape.lineTo(x, y + radius);
  shape.quadraticCurveTo(
    x,
    y,
    x + radius,
    y
  );

  return new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: Math.min(radius * 0.38, 0.06),
    bevelThickness: Math.min(radius * 0.38, 0.06),
    curveSegments: 6
  });
}

function createRoundedBox({
  width,
  height,
  depth,
  radius = 0.12,
  material
}) {
  const geometry = roundedBoxGeometry(
    width,
    height,
    depth,
    radius
  );

  geometry.center();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  return mesh;
}

function createTextTexture({
  lines,
  width = 1024,
  height = 512,
  background = "#050505",
  color = "#fff200",
  secondaryColor = "#ffffff",
  borderColor = "#d4b400"
}) {
  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  const gradient = ctx.createRadialGradient(
    width / 2,
    height / 2,
    20,
    width / 2,
    height / 2,
    width * 0.7
  );

  gradient.addColorStop(0, "#272000");
  gradient.addColorStop(0.6, background);
  gradient.addColorStop(1, "#000000");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 20;
  ctx.strokeRect(12, 12, width - 24, height - 24);

  lines.forEach((line, index) => {
    ctx.save();

    ctx.font = line.font;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = line.shadow || color;
    ctx.shadowBlur = line.shadowBlur ?? 35;

    ctx.fillStyle = line.color || (
      index === 0 ? color : secondaryColor
    );

    ctx.fillText(
      line.text,
      width / 2,
      line.y
    );

    ctx.restore();
  });

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  return texture;
}

function createLabelTexture(text, options = {}) {
  const canvas = document.createElement("canvas");

  canvas.width = options.width || 512;
  canvas.height = options.height || 256;

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (options.background) {
    ctx.fillStyle = options.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = options.font || "bold 90px Arial";
  ctx.fillStyle = options.color || "#ffffff";

  ctx.shadowColor = options.shadow || options.color || "#ffffff";
  ctx.shadowBlur = options.shadowBlur ?? 20;

  ctx.fillText(
    text,
    canvas.width / 2,
    canvas.height / 2
  );

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;

  return texture;
}

function createPlane(width, height, texture, transparent = false) {
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent,
    toneMapped: false
  });

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height),
    material
  );

  return mesh;
}

const reelSymbols = [

function createReelTexture(offset = 0) {
  const canvas = document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 1536;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#f7f7f7";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const symbolHeight = canvas.height / reelSymbols.length;

  reelSymbols.forEach((symbol, index) => {
    const current = reelSymbols[
      (index + offset) % reelSymbols.length
    ];

    ctx.fillStyle = index % 2 === 0
      ? "#ffffff"
      : "#e8e8e8";

    ctx.fillRect(
      0,
      index * symbolHeight,
      canvas.width,
      symbolHeight
    );

    ctx.strokeStyle = "#c0c0c0";
    ctx.lineWidth = 6;

    ctx.strokeRect(
      5,
      index * symbolHeight + 5,
      canvas.width - 10,
      symbolHeight - 10
    );

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (current === "7") {
      ctx.font = "bold 200px Arial";
      ctx.fillStyle = "#e00000";
      ctx.shadowColor = "#ffcc00";
      ctx.shadowBlur = 15;
    } else if (current === "BAR") {
      ctx.font = "bold 112px Arial";
      ctx.fillStyle = "#111111";
      ctx.shadowColor = "#ffd000";
      ctx.shadowBlur = 10;
    } else if (current === "★") {
      ctx.font = "bold 210px Arial";
      ctx.fillStyle = "#ffcc00";
      ctx.shadowColor = "#ff7900";
      ctx.shadowBlur = 14;
    } else {
      ctx.font = "bold 170px Arial";
      ctx.fillStyle = "#111111";
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
    }

    ctx.fillText(
      current,
      canvas.width / 2,
      index * symbolHeight + symbolHeight / 2
    );
  });

  const texture = new THREE.CanvasTexture(canvas);

  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  return texture;
}

function createReel(x, textureOffset) {
  const reelGroup = new THREE.Group();

  const frame = createRoundedBox({
    width: 1.0,
    height: 1.78,
    depth: 0.28,
    radius: 0.12,
    material: silverMetal
  });

  reelGroup.add(frame);

  const reelTexture = createReelTexture(textureOffset);

  const cylinderMaterial = new THREE.MeshPhysicalMaterial({
    map: reelTexture,
    color: 0xffffff,
    metalness: 0.02,
    roughness: 0.3,
    clearcoat: 0.5
  });

  const reelCylinder = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.65,
      0.65,
      0.78,
      64,
      1,
      false
    ),
    cylinderMaterial
  );

  reelCylinder.rotation.z = Math.PI / 2;
  reelCylinder.rotation.y = Math.PI / 2;

  reelCylinder.scale.set(0.85, 1, 1);

  reelCylinder.position.z = 0.2;
  reelCylinder.castShadow = true;
  reelCylinder.receiveShadow = true;

  reelGroup.add(reelCylinder);

  const maskTop = createRoundedBox({
    width: 0.88,
    height: 0.42,
    depth: 0.2,
    radius: 0.05,
    material: blackMetal
  });

  maskTop.position.set(0, 0.68, 0.3);
  reelGroup.add(maskTop);

  const maskBottom = maskTop.clone();
  maskBottom.position.y = -0.68;
  reelGroup.add(maskBottom);

  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(0.82, 1.47),
    glassMaterial
  );

  glass.position.z = 0.52;
  reelGroup.add(glass);

  reelGroup.position.set(x, 0.77, 1.25);
  machine.add(reelGroup);

  return {
    group: reelGroup,
    cylinder: reelCylinder
  };
}

/* =========================================================
   軽い発光アニメーション
========================================================= */

const clock = new THREE.Clock();

function animateLedGroup(group, time, phase) {
  group.children.forEach((led, index) => {
    const material = led.material;

    const wave =
      Math.sin(
        time * 4.5 +
        index * 0.55 +
        phase
      ) * 0.5 + 0.5;

    material.emissiveIntensity =
      1.7 + wave * 4.5;

    led.scale.setScalar(
      0.82 + wave * 0.32
    );
  });
}

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();

  controls.update();

  animateLedGroup(
    leftLedGroup,
    elapsed,
    0
  );

  animateLedGroup(
    rightLedGroup,
    elapsed,
    Math.PI
  );

  topLedMaterial.emissiveIntensity =
    2.8 +
    (Math.sin(elapsed * 3.2) * 0.5 + 0.5) * 3.5;

  topLedLight.intensity =
    8 +
    (Math.sin(elapsed * 3.2) * 0.5 + 0.5) * 12;

  lampMaterial.emissiveIntensity =
    0.35 +
    (Math.sin(elapsed * 2.1) * 0.5 + 0.5) * 0.55;

  renderer.render(scene, camera);
}

animate();

/* =========================================================
   リサイズ対応
========================================================= */

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  if (width < 600) {
    camera.position.set(3.65, 2.3, 9.7);
  }
}

window.addEventListener("resize", resize);
resize();

  loading.classList.add("hide");

  setTimeout(() => {
    loading.remove();
  }, 500);
});
