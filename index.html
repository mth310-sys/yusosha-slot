<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>遊創舎 共通パチスロ筐体</title>

<style>
/* =========================================================
   遊創舎 共通パチスロ筐体
   パーツ分割型・組立ベース
========================================================= */

* {
  box-sizing: border-box;
}

:root {
  /* 筐体全体寸法 */
  --cabinet-width: 390px;
  --cabinet-height: 760px;

  /* 共通色 */
  --cabinet-black: #080808;
  --cabinet-dark: #151515;
  --cabinet-metal: #777;
  --cabinet-silver: #d8d8d8;
  --cabinet-gold: #c5a52b;

  /* 共通奥行き */
  --cabinet-depth-shadow:
    0 22px 35px rgba(0, 0, 0, 0.85);
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: flex-start;

  padding: 20px 8px 50px;

  background:
    radial-gradient(
      circle at center top,
      #353535 0%,
      #111 45%,
      #020202 100%
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =========================================================
   00：筐体全体ラッパー
========================================================= */

#yusosha-slot-machine {
  position: relative;

  width: min(
    var(--cabinet-width),
    calc(100vw - 16px)
  );

  min-height: var(--cabinet-height);
}

/* =========================================================
   01：筐体外装フレーム
========================================================= */

#cabinet-outer-frame {
  position: relative;

  width: 100%;
  min-height: var(--cabinet-height);

  padding: 16px;

  border-radius: 30px 30px 18px 18px;

  background: #111;

  box-shadow:
    var(--cabinet-depth-shadow);

  overflow: hidden;
}

/* =========================================================
   02：左サイド外装
========================================================= */

#cabinet-side-left {
  position: absolute;

  top: 25px;
  bottom: 25px;
  left: 0;

  width: 22px;

  background: #252525;
}

/* =========================================================
   03：右サイド外装
========================================================= */

#cabinet-side-right {
  position: absolute;

  top: 25px;
  right: 0;
  bottom: 25px;

  width: 22px;

  background: #252525;
}

/* =========================================================
   04：筐体中央ボディ
========================================================= */

#cabinet-main-body {
  position: relative;
  z-index: 2;

  width: 100%;
}

/* 各ユニット共通 */

.cabinet-unit {
  position: relative;

  width: 100%;

  margin-bottom: 8px;

  border-radius: 10px;

  background: #171717;

  border: 1px solid #333;
}

/* =========================================================
   05：天板
========================================================= */

#cabinet-top-cap {
  height: 20px;

  border-radius: 15px 15px 5px 5px;

  background: #333;
}

/* =========================================================
   06：上部ランプユニット
========================================================= */

#top-light-unit {
  height: 34px;
}

/* 上部ランプ本体 */

#top-light-bar {
  position: absolute;
  inset: 6px 28px;

  border-radius: 20px;

  background: #3b3b3b;
}

/* =========================================================
   07：上部タイトルパネルユニット
========================================================= */

#title-panel-unit {
  height: 92px;

  padding: 10px;
}

/* タイトルパネル取付枠 */

#title-panel-bezel {
  width: 100%;
  height: 100%;

  padding: 6px;

  border-radius: 9px;

  background: #303030;
}

/* タイトルパネル表示面 */

#title-panel-surface {
  width: 100%;
  height: 100%;

  border-radius: 6px;

  background: #080808;
}

/* =========================================================
   08：上部液晶ユニット
========================================================= */

#upper-display-unit {
  height: 145px;

  padding: 10px;
}

/* 液晶外周ベゼル */

#upper-display-bezel {
  width: 100%;
  height: 100%;

  padding: 8px;

  border-radius: 10px;

  background: #333;
}

/* 液晶保護ガラス */

#upper-display-glass {
  position: relative;

  width: 100%;
  height: 100%;

  border-radius: 5px;

  background: #050505;

  overflow: hidden;
}

/* 液晶表示面 */

#upper-display-screen {
  position: absolute;
  inset: 5px;

  background: #101010;
}

/* =========================================================
   09：中央装飾パネル
========================================================= */

#center-decoration-unit {
  height: 44px;

  padding: 6px 12px;
}

#center-decoration-panel {
  width: 100%;
  height: 100%;

  border-radius: 6px;

  background: #090909;
}

/* =========================================================
   10：リールユニット
========================================================= */

#reel-unit {
  height: 190px;

  padding: 10px;
}

/* リール外周ベゼル */

#reel-bezel {
  width: 100%;
  height: 100%;

  padding: 9px;

  border-radius: 11px;

  background: #383838;
}

/* リール保護ガラス */

#reel-glass {
  position: relative;

  width: 100%;
  height: 100%;

  padding: 5px;

  border-radius: 6px;

  background: #050505;
}

/* リール機構取付部 */

#reel-mechanism {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;

  width: 100%;
  height: 100%;
}

/* 左リール取付部 */

#reel-left-mount {
  background: #181818;
}

/* 中リール取付部 */

#reel-center-mount {
  background: #181818;
}

/* 右リール取付部 */

#reel-right-mount {
  background: #181818;
}

/* =========================================================
   11：情報表示ユニット
========================================================= */

#information-display-unit {
  height: 65px;

  padding: 8px 12px;
}

#information-display-frame {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;

  width: 100%;
  height: 100%;
}

/* クレジット表示取付部 */

#credit-display-mount {
  background: #050505;
}

/* ベット表示取付部 */

#bet-display-mount {
  background: #050505;
}

/* 払出表示取付部 */

#payout-display-mount {
  background: #050505;
}

/* =========================================================
   12：操作パネルユニット
========================================================= */

#control-panel-unit {
  height: 150px;

  padding: 10px;
}

/* 操作盤本体 */

#control-panel-surface {
  position: relative;

  width: 100%;
  height: 100%;

  border-radius: 10px 10px 16px 16px;

  background: #202020;
}

/* =========================================================
   13：ベットボタン取付部
========================================================= */

#bet-button-mount {
  position: absolute;

  top: 14px;
  left: 82px;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  background: #080808;
}

/* =========================================================
   14：マックスベットボタン取付部
========================================================= */

#max-bet-button-mount {
  position: absolute;

  top: 14px;
  left: 50%;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  background: #080808;

  transform: translateX(-50%);
}

/* =========================================================
   15：精算ボタン取付部
========================================================= */

#return-button-mount {
  position: absolute;

  top: 14px;
  right: 82px;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  background: #080808;
}

/* =========================================================
   16：スタートレバー取付部
========================================================= */

#start-lever-mount {
  position: absolute;

  left: 15px;
  bottom: 18px;

  width: 52px;
  height: 52px;

  border-radius: 50%;

  background: #070707;
}

/* =========================================================
   17：左STOPボタン取付部
========================================================= */

#stop-button-left-mount {
  position: absolute;

  left: 79px;
  bottom: 14px;

  width: 62px;
  height: 62px;

  border-radius: 50%;

  background: #080808;
}

/* =========================================================
   18：中央STOPボタン取付部
========================================================= */

#stop-button-center-mount {
  position: absolute;

  left: 50%;
  bottom: 14px;

  width: 62px;
  height: 62px;

  border-radius: 50%;

  background: #080808;

  transform: translateX(-50%);
}

/* =========================================================
   19：右STOPボタン取付部
========================================================= */

#stop-button-right-mount {
  position: absolute;

  right: 79px;
  bottom: 14px;

  width: 62px;
  height: 62px;

  border-radius: 50%;

  background: #080808;
}

/* =========================================================
   20：メダル投入口取付部
========================================================= */

#medal-insert-mount {
  position: absolute;

  top: 28px;
  right: 18px;

  width: 42px;
  height: 9px;

  border-radius: 5px;

  background: #020202;
}

/* =========================================================
   21：下部装飾パネルユニット
========================================================= */

#lower-decoration-unit {
  height: 105px;

  padding: 9px 12px;
}

/* 下部パネル外周枠 */

#lower-panel-bezel {
  position: relative;

  width: 100%;
  height: 100%;

  padding: 7px;

  border-radius: 8px;

  background: #303030;
}

/* 下部パネル表示面 */

#lower-panel-surface {
  width: 100%;
  height: 100%;

  border-radius: 5px;

  background: #080808;
}

/* =========================================================
   22：左スピーカーユニット
========================================================= */

#speaker-left-unit {
  position: absolute;

  left: 15px;
  bottom: 13px;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  background: #111;
}

/* =========================================================
   23：右スピーカーユニット
========================================================= */

#speaker-right-unit {
  position: absolute;

  right: 15px;
  bottom: 13px;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  background: #111;
}

/* =========================================================
   24：メダル払出ユニット
========================================================= */

#medal-payout-unit {
  height: 35px;

  padding: 7px 65px;
}

#medal-payout-opening {
  width: 100%;
  height: 100%;

  border-radius: 5px 5px 12px 12px;

  background: #020202;
}

/* =========================================================
   25：下皿ユニット
========================================================= */

#medal-tray-unit {
  height: 83px;

  padding: 8px 12px 12px;
}

#medal-tray {
  width: 100%;
  height: 100%;

  border-radius: 5px 5px 16px 16px;

  background: #111;
}

/* =========================================================
   26：筐体底部
========================================================= */

#cabinet-bottom-base {
  height: 15px;

  margin: 0 22px;

  border-radius: 0 0 10px 10px;

  background: #222;
}

/* =========================================================
   部品名確認用ラベル
   完成時は body の show-part-names を削除する
========================================================= */

.show-part-names [data-part-name]::before {
  content: attr(data-part-name);

  position: absolute;
  z-index: 100;

  top: 3px;
  left: 5px;

  padding: 2px 4px;

  color: #fff;
  background: rgba(0, 0, 0, 0.7);

  border-radius: 3px;

  font-size: 8px;
  line-height: 1.2;

  pointer-events: none;
}
</style>
</head>

<body class="show-part-names">

<!-- ======================================================
     00：遊創舎 共通パチスロ筐体
======================================================= -->

<main
  id="yusosha-slot-machine"
  data-part-name="00 共通パチスロ筐体"
>

  <!-- 01：筐体外装フレーム -->
  <div
    id="cabinet-outer-frame"
    data-part-name="01 筐体外装フレーム"
  >

    <!-- 02：左サイド外装 -->
    <aside
      id="cabinet-side-left"
      data-part-name="02 左サイド外装"
    ></aside>

    <!-- 03：右サイド外装 -->
    <aside
      id="cabinet-side-right"
      data-part-name="03 右サイド外装"
    ></aside>

    <!-- 04：筐体中央ボディ -->
    <div
      id="cabinet-main-body"
      data-part-name="04 筐体中央ボディ"
    >

      <!-- 05：天板 -->
      <div
        id="cabinet-top-cap"
        data-part-name="05 天板"
      ></div>

      <!-- 06：上部ランプユニット -->
      <section
        id="top-light-unit"
        class="cabinet-unit"
        data-part-name="06 上部ランプユニット"
      >
        <div
          id="top-light-bar"
          data-part-name="06-A 上部ランプ本体"
        ></div>
      </section>

      <!-- 07：上部タイトルパネルユニット -->
      <section
        id="title-panel-unit"
        class="cabinet-unit"
        data-part-name="07 上部タイトルパネル"
      >
        <div
          id="title-panel-bezel"
          data-part-name="07-A タイトルパネル枠"
        >
          <div
            id="title-panel-surface"
            data-part-name="07-B タイトルパネル面"
          ></div>
        </div>
      </section>

      <!-- 08：上部液晶ユニット -->
      <section
        id="upper-display-unit"
        class="cabinet-unit"
        data-part-name="08 上部液晶ユニット"
      >
        <div
          id="upper-display-bezel"
          data-part-name="08-A 液晶ベゼル"
        >
          <div
            id="upper-display-glass"
            data-part-name="08-B 液晶保護ガラス"
          >
            <div
              id="upper-display-screen"
              data-part-name="08-C 液晶表示面"
            ></div>
          </div>
        </div>
      </section>

      <!-- 09：中央装飾パネル -->
      <section
        id="center-decoration-unit"
        class="cabinet-unit"
        data-part-name="09 中央装飾パネル"
      >
        <div
          id="center-decoration-panel"
          data-part-name="09-A 中央装飾面"
        ></div>
      </section>

      <!-- 10：リールユニット -->
      <section
        id="reel-unit"
        class="cabinet-unit"
        data-part-name="10 リールユニット"
      >
        <div
          id="reel-bezel"
          data-part-name="10-A リールベゼル"
        >
          <div
            id="reel-glass"
            data-part-name="10-B リール保護ガラス"
          >
            <div
              id="reel-mechanism"
              data-part-name="10-C リール機構"
            >
              <div
                id="reel-left-mount"
                data-part-name="10-D 左リール"
              ></div>

              <div
                id="reel-center-mount"
                data-part-name="10-E 中リール"
              ></div>

              <div
                id="reel-right-mount"
                data-part-name="10-F 右リール"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 11：情報表示ユニット -->
      <section
        id="information-display-unit"
        class="cabinet-unit"
        data-part-name="11 情報表示ユニット"
      >
        <div id="information-display-frame">

          <div
            id="credit-display-mount"
            data-part-name="11-A CREDIT表示部"
          ></div>

          <div
            id="bet-display-mount"
            data-part-name="11-B BET表示部"
          ></div>

          <div
            id="payout-display-mount"
            data-part-name="11-C PAYOUT表示部"
          ></div>

        </div>
      </section>

      <!-- 12：操作パネルユニット -->
      <section
        id="control-panel-unit"
        class="cabinet-unit"
        data-part-name="12 操作パネル"
      >
        <div
          id="control-panel-surface"
          data-part-name="12-A 操作盤表面"
        >

          <div
            id="bet-button-mount"
            data-part-name="13 BETボタン"
          ></div>

          <div
            id="max-bet-button-mount"
            data-part-name="14 MAX BETボタン"
          ></div>

          <div
            id="return-button-mount"
            data-part-name="15 精算ボタン"
          ></div>

          <div
            id="start-lever-mount"
            data-part-name="16 STARTレバー"
          ></div>

          <div
            id="stop-button-left-mount"
            data-part-name="17 左STOPボタン"
          ></div>

          <div
            id="stop-button-center-mount"
            data-part-name="18 中央STOPボタン"
          ></div>

          <div
            id="stop-button-right-mount"
            data-part-name="19 右STOPボタン"
          ></div>

          <div
            id="medal-insert-mount"
            data-part-name="20 メダル投入口"
          ></div>

        </div>
      </section>

      <!-- 21：下部装飾パネル -->
      <section
        id="lower-decoration-unit"
        class="cabinet-unit"
        data-part-name="21 下部装飾パネル"
      >
        <div
          id="lower-panel-bezel"
          data-part-name="21-A 下部パネル枠"
        >
          <div
            id="lower-panel-surface"
            data-part-name="21-B 下部パネル面"
          ></div>

          <div
            id="speaker-left-unit"
            data-part-name="22 左スピーカー"
          ></div>

          <div
            id="speaker-right-unit"
            data-part-name="23 右スピーカー"
          ></div>
        </div>
      </section>

      <!-- 24：メダル払出ユニット -->
      <section
        id="medal-payout-unit"
        class="cabinet-unit"
        data-part-name="24 メダル払出ユニット"
      >
        <div
          id="medal-payout-opening"
          data-part-name="24-A メダル払出口"
        ></div>
      </section>

      <!-- 25：下皿ユニット -->
      <section
        id="medal-tray-unit"
        class="cabinet-unit"
        data-part-name="25 下皿ユニット"
      >
        <div
          id="medal-tray"
          data-part-name="25-A メダル受け皿"
        ></div>
      </section>

      <!-- 26：筐体底部 -->
      <div
        id="cabinet-bottom-base"
        data-part-name="26 筐体底部"
      ></div>

    </div>
  </div>
</main>

</body>
</html>
