<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>遊創舎 共通筐体 Ver.1.1</title>

<style>
/* =========================================================
   基本設定
========================================================= */

* {
  box-sizing: border-box;
}

:root {
  --machine-width: 390px;

  --black-1: #020202;
  --black-2: #090909;
  --black-3: #151515;
  --black-4: #242424;

  --silver-1: #ffffff;
  --silver-2: #cfcfcf;
  --silver-3: #777777;
  --silver-4: #292929;
  --silver-5: #080808;

  --gold-1: #fff4a1;
  --gold-2: #e4bd20;
  --gold-3: #6f4c00;

  --led-main: #ff3fbf;
  --led-light: #ffd4f4;
  --led-dark: #9d006f;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  padding: 16px 8px 30px;

  background:
    radial-gradient(
      circle at 50% 28%,
      #282022 0%,
      #100d0f 34%,
      #030303 72%
    );

  color: #ffffff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  display: flex;
  justify-content: center;
  align-items: flex-start;
}


/* =========================================================
   全体ラッパー
========================================================= */

.machine-wrap {
  width: min(var(--machine-width), 100%);
  position: relative;
  padding: 9px 7px 18px;
}


/* 床面の影 */
.machine-wrap::after {
  content: "";
  position: absolute;
  left: 11%;
  right: 11%;
  bottom: 2px;
  height: 23px;

  border-radius: 50%;
  background: rgba(0, 0, 0, 0.85);
  filter: blur(11px);

  z-index: 0;
}


/* =========================================================
   外周筐体
========================================================= */

.machine {
  position: relative;
  z-index: 1;

  width: 100%;
  min-height: 620px;

  padding:
    58px
    31px
    17px;

  border-radius:
    47px
    47px
    31px
    31px;

  background:
    linear-gradient(
      90deg,
      #050505 0%,
      #242424 4%,
      #060606 10%,
      #000000 18%,
      #0a0a0a 50%,
      #000000 82%,
      #060606 90%,
      #242424 96%,
      #050505 100%
    );

  border: 2px solid #313131;

  box-shadow:
    0 0 0 2px #050505,
    0 0 0 4px #3a3a3a,
    0 14px 38px rgba(0, 0, 0, 0.95),
    inset 0 0 35px rgba(255, 255, 255, 0.07),
    inset 0 0 65px rgba(0, 0, 0, 0.95);

  overflow: visible;
}


/* 内部の暗い背面 */
.machine-inner {
  position: relative;
  z-index: 5;

  display: flex;
  flex-direction: column;
  gap: 6px;

  padding: 8px 8px 10px;

  border-radius: 20px 20px 17px 17px;

  background:
    linear-gradient(
      90deg,
      #070707 0%,
      #1e1e1e 4%,
      #050505 10%,
      #000000 50%,
      #050505 90%,
      #1e1e1e 96%,
      #070707 100%
    );

  border: 1px solid #4b4b4b;

  box-shadow:
    inset 0 0 18px rgba(255, 255, 255, 0.05),
    inset 0 0 45px rgba(0, 0, 0, 1),
    0 0 0 2px #050505;
}


/* =========================================================
   トップクラウン
========================================================= */

.top-crown {
  position: absolute;

  top: -4px;
  left: -7px;
  right: -7px;

  height: 72px;

  z-index: 12;

  border-radius:
    44px
    44px
    23px
    23px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #bdbdbd 8%,
      #474747 18%,
      #101010 34%,
      #050505 67%,
      #363636 88%,
      #c8c8c8 96%,
      #ffffff 100%
    );

  border: 2px solid #858585;

  box-shadow:
    0 4px 0 #000000,
    0 8px 18px rgba(0, 0, 0, 0.8),
    inset 0 3px 4px rgba(255, 255, 255, 0.75),
    inset 0 -6px 9px rgba(0, 0, 0, 0.92);
}


/* クラウン中央の黒い面 */
.top-crown::before {
  content: "";

  position: absolute;
  inset: 9px 25px 15px;

  border-radius: 27px 27px 15px 15px;

  background:
    linear-gradient(
      180deg,
      #191919 0%,
      #030303 55%,
      #111111 100%
    );

  border: 2px solid #050505;

  box-shadow:
    inset 0 0 13px rgba(255, 255, 255, 0.08),
    inset 0 0 24px #000000,
    0 2px 3px rgba(255, 255, 255, 0.2);
}


/* クラウン発光レンズ */
.crown-led {
  position: absolute;

  left: 42px;
  right: 42px;
  top: 17px;

  height: 14px;

  z-index: 2;

  border-radius: 999px;

  background:
    radial-gradient(
      ellipse at 50% 30%,
      #ffffff 0%,
      var(--led-light) 18%,
      var(--led-main) 43%,
      var(--led-dark) 76%,
      #250019 100%
    );

  border: 1px solid #ffc8ee;

  box-shadow:
    0 0 5px #ffffff,
    0 0 12px var(--led-main),
    0 0 22px rgba(255, 63, 191, 0.9),
    inset 0 1px 4px #ffffff,
    inset 0 -4px 7px rgba(30, 0, 20, 0.8);

  animation: crownGlow 2.2s ease-in-out infinite;
}

.crown-led::after {
  content: "";

  position: absolute;
  left: 9%;
  right: 9%;
  top: 2px;

  height: 3px;

  border-radius: 999px;
  background: rgba(255, 255, 255, 0.84);
  filter: blur(0.5px);
}


/* =========================================================
   左右サイドフレーム
========================================================= */

.side-frame {
  position: absolute;

  top: 48px;
  bottom: 22px;

  width: 38px;

  z-index: 9;

  pointer-events: none;
}


/* 左 */
.side-frame.left {
  left: -3px;

  border-radius:
    29px
    14px
    19px
    31px;

  clip-path: polygon(
    21% 0%,
    100% 2%,
    87% 18%,
    98% 36%,
    81% 52%,
    93% 69%,
    77% 84%,
    100% 100%,
    12% 100%,
    0% 87%,
    14% 70%,
    3% 50%,
    18% 31%,
    4% 13%
  );
}


/* 右 */
.side-frame.right {
  right: -3px;

  border-radius:
    14px
    29px
    31px
    19px;

  clip-path: polygon(
    0% 2%,
    79% 0%,
    96% 13%,
    82% 31%,
    97% 50%,
    86% 70%,
    100% 87%,
    88% 100%,
    0% 100%,
    23% 84%,
    7% 69%,
    19% 52%,
    2% 36%,
    13% 18%
  );
}


/* メッキ本体 */
.side-frame {
  background:
    linear-gradient(
      90deg,
      #050505 0%,
      #777777 9%,
      #ffffff 17%,
      #565656 27%,
      #080808 42%,
      #2b2b2b 64%,
      #d7d7d7 82%,
      #545454 92%,
      #050505 100%
    );

  border: 1px solid #a1a1a1;

  box-shadow:
    0 0 0 2px #050505,
    0 0 11px rgba(0, 0, 0, 0.95),
    inset 0 0 7px rgba(255, 255, 255, 0.7),
    inset 0 0 17px rgba(0, 0, 0, 0.85);
}


/* ゴールドアクセント */
.side-gold {
  position: absolute;

  top: 8px;
  bottom: 8px;

  width: 8px;

  border-radius: 999px;

  background:
    linear-gradient(
      90deg,
      #5c3a00 0%,
      #fff0a0 28%,
      #f2c229 52%,
      #6c4700 100%
    );

  box-shadow:
    0 0 4px rgba(255, 218, 63, 0.65),
    inset 1px 0 2px rgba(255, 255, 255, 0.75),
    inset -2px 0 3px rgba(60, 30, 0, 0.8);
}

.left .side-gold {
  right: 8px;
}

.right .side-gold {
  left: 8px;
}


/* =========================================================
   LEDレンズ列
========================================================= */

.side-led-column {
  position: absolute;

  top: 23px;
  bottom: 23px;

  width: 11px;

  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
}

.left .side-led-column {
  left: 7px;
}

.right .side-led-column {
  right: 7px;
}

.side-led {
  width: 9px;
  height: 18px;

  border-radius: 50%;

  background:
    radial-gradient(
      ellipse at 35% 25%,
      #ffffff 0%,
      #ffe4f8 16%,
      var(--led-main) 42%,
      #a80073 73%,
      #230018 100%
    );

  border: 1px solid rgba(255, 220, 246, 0.9);

  box-shadow:
    0 0 4px #ffffff,
    0 0 9px var(--led-main),
    0 0 15px rgba(255, 63, 191, 0.8),
    inset 0 2px 3px #ffffff,
    inset 0 -4px 4px rgba(45, 0, 31, 0.8);

  animation: sideLedPulse 1.7s ease-in-out infinite;
}

.side-led:nth-child(2n) {
  animation-delay: 0.35s;
}

.side-led:nth-child(3n) {
  animation-delay: 0.7s;
}


/* =========================================================
   共通パネル
========================================================= */

.panel {
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      145deg,
      #292929 0%,
      #080808 12%,
      #020202 58%,
      #151515 86%,
      #3a3a3a 100%
    );

  border: 2px solid #505050;

  box-shadow:
    inset 0 0 0 2px #050505,
    inset 0 0 14px rgba(255, 255, 255, 0.05),
    inset 0 0 24px #000000,
    0 2px 6px rgba(0, 0, 0, 0.9);
}


/* パネル上部の反射 */
.panel::before {
  content: "";

  position: absolute;
  left: 9%;
  right: 9%;
  top: 3px;

  height: 1px;

  background: rgba(255, 255, 255, 0.25);
}


/* =========================================================
   タイトルパネル
========================================================= */

.title-panel {
  height: 65px;

  border-radius: 16px 16px 11px 11px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      #171717 0%,
      #050505 62%,
      #000000 100%
    );
}


/* 内側タイトル画面 */
.title-screen {
  width: calc(100% - 18px);
  height: calc(100% - 14px);

  border-radius: 11px;

  background:
    linear-gradient(
      180deg,
      #080808 0%,
      #000000 100%
    );

  border: 2px solid #242424;

  box-shadow:
    inset 0 0 15px #000000,
    0 0 0 1px #535353;
}


/* =========================================================
   メイン表示パネル
========================================================= */

.display-panel {
  height: 166px;
  border-radius: 12px;
  padding: 7px;
}

.display-screen {
  width: 100%;
  height: 100%;

  border-radius: 8px;

  background:
    radial-gradient(
      circle at 50% 40%,
      #121212 0%,
      #030303 64%,
      #000000 100%
    );

  border: 2px solid #090909;

  box-shadow:
    inset 0 0 20px #000000,
    inset 0 0 3px rgba(255, 255, 255, 0.1),
    0 0 0 1px #3e3e3e;
}


/* =========================================================
   リールパネル
========================================================= */

.reel-panel {
  height: 133px;

  border-radius: 11px;
  padding: 8px;

  background:
    linear-gradient(
      180deg,
      #353535 0%,
      #0c0c0c 12%,
      #030303 45%,
      #131313 88%,
      #3a3a3a 100%
    );
}

.reel-window {
  height: 100%;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;

  padding: 6px;

  border-radius: 8px;

  background:
    linear-gradient(
      180deg,
      #050505 0%,
      #1d1d1d 8%,
      #000000 20%,
      #000000 80%,
      #252525 94%,
      #050505 100%
    );

  border: 2px solid #585858;

  box-shadow:
    inset 0 0 13px #000000,
    0 0 0 2px #050505;
}

.reel {
  position: relative;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #171717 0%,
      #030303 50%,
      #171717 100%
    );

  border: 2px solid #333333;

  box-shadow:
    inset 0 0 14px #000000;
}

.reel + .reel::before {
  content: "";

  position: absolute;
  left: -5px;
  top: 4px;
  bottom: 4px;

  width: 1px;

  background: #6e6e6e;

  box-shadow:
    1px 0 0 #000000;
}


/* =========================================================
   操作卓
========================================================= */

.control-deck {
  position: relative;

  height: 94px;

  margin-left: -13px;
  margin-right: -13px;

  padding: 14px 16px 11px;

  border-radius:
    11px
    11px
    23px
    23px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #acacac 5%,
      #343434 12%,
      #090909 25%,
      #181818 62%,
      #030303 84%,
      #393939 100%
    );

  border: 2px solid #777777;

  box-shadow:
    0 8px 0 #030303,
    0 12px 15px rgba(0, 0, 0, 0.75),
    inset 0 3px 4px rgba(255, 255, 255, 0.5),
    inset 0 -8px 12px rgba(0, 0, 0, 0.95);

  transform: perspective(400px) rotateX(2deg);
}


/* 操作卓の前縁 */
.control-deck::after {
  content: "";

  position: absolute;

  left: 9px;
  right: 9px;
  bottom: -9px;

  height: 12px;

  border-radius: 0 0 20px 20px;

  background:
    linear-gradient(
      180deg,
      #252525 0%,
      #050505 55%,
      #000000 100%
    );

  border: 1px solid #3c3c3c;

  box-shadow:
    inset 0 2px 2px rgba(255, 255, 255, 0.12);
}


/* 操作部品配置 */
.control-grid {
  position: relative;
  z-index: 2;

  display: grid;
  grid-template-columns: 50px 1fr;
  align-items: center;
  gap: 10px;

  height: 100%;
}


/* レバー */
.lever-base {
  width: 45px;
  height: 45px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #303030 0%,
      #060606 61%,
      #777777 66%,
      #1a1a1a 100%
    );

  box-shadow:
    inset 0 0 7px #000000,
    0 2px 5px rgba(0, 0, 0, 0.9);
}

.lever {
  position: relative;

  width: 13px;
  height: 34px;

  border-radius: 999px;

  background:
    linear-gradient(
      90deg,
      #222222 0%,
      #ffffff 27%,
      #777777 50%,
      #1c1c1c 100%
    );

  transform: rotate(16deg);

  box-shadow:
    2px 3px 5px rgba(0, 0, 0, 0.9);
}

.lever::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -7px;

  width: 22px;
  height: 22px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #ffffff 0%,
      #ff9be1 18%,
      #d91691 48%,
      #67003f 100%
    );

  border: 2px solid #ffd6f2;

  box-shadow:
    0 0 7px var(--led-main),
    inset 0 -4px 5px rgba(55, 0, 35, 0.7);
}


/* ボタン群 */
.control-buttons {
  display: grid;
  grid-template-columns: 34px repeat(3, 1fr);
  gap: 7px;
  align-items: center;
}

.small-button {
  width: 30px;
  height: 30px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffffff 0%,
      #d3d3d3 13%,
      #656565 44%,
      #121212 78%,
      #000000 100%
    );

  border: 2px solid #8b8b8b;

  box-shadow:
    0 3px 0 #000000,
    inset 0 2px 3px rgba(255, 255, 255, 0.65);
}

.stop-button {
  width: 54px;
  height: 54px;

  margin: auto;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 27%,
      #ffffff 0%,
      #ffcdcd 9%,
      #f02626 30%,
      #a00000 67%,
      #350000 100%
    );

  border: 4px solid #d3d3d3;

  box-shadow:
    0 0 0 3px #202020,
    0 4px 0 #000000,
    0 0 8px rgba(255, 255, 255, 0.32),
    inset 0 3px 4px rgba(255, 255, 255, 0.75),
    inset 0 -8px 8px rgba(50, 0, 0, 0.65);
}


/* =========================================================
   下部パネル
========================================================= */

.lower-panel {
  height: 111px;

  margin-top: 5px;

  border-radius: 13px 13px 18px 18px;
  padding: 8px;

  background:
    linear-gradient(
      145deg,
      #282828 0%,
      #070707 14%,
      #000000 60%,
      #1d1d1d 100%
    );
}

.lower-screen {
  width: 100%;
  height: 100%;

  border-radius: 9px;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      #151515 0%,
      #040404 66%,
      #000000 100%
    );

  border: 2px solid #292929;

  box-shadow:
    inset 0 0 18px #000000,
    0 0 0 1px #535353;
}


/* =========================================================
   ベース
========================================================= */

.machine-base {
  position: relative;

  height: 29px;

  margin:
    6px
    -7px
    -9px;

  border-radius:
    6px
    6px
    20px
    20px;

  background:
    linear-gradient(
      180deg,
      #383838 0%,
      #0b0b0b 33%,
      #000000 100%
    );

  border: 1px solid #555555;

  box-shadow:
    inset 0 3px 3px rgba(255, 255, 255, 0.08),
    0 6px 9px rgba(0, 0, 0, 0.8);
}

.machine-base::after {
  content: "";

  position: absolute;

  left: 18px;
  right: 18px;
  bottom: 5px;

  height: 5px;

  border-radius: 999px;

  background: #020202;

  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.09);
}


/* =========================================================
   アニメーション
========================================================= */

@keyframes crownGlow {
  0%,
  100% {
    opacity: 0.75;

    box-shadow:
      0 0 5px #ffffff,
      0 0 10px var(--led-main),
      0 0 18px rgba(255, 63, 191, 0.68),
      inset 0 1px 4px #ffffff,
      inset 0 -4px 7px rgba(30, 0, 20, 0.8);
  }

  50% {
    opacity: 1;

    box-shadow:
      0 0 7px #ffffff,
      0 0 17px var(--led-main),
      0 0 29px rgba(255, 63, 191, 1),
      inset 0 1px 5px #ffffff,
      inset 0 -4px 7px rgba(30, 0, 20, 0.8);
  }
}

@keyframes sideLedPulse {
  0%,
  100% {
    opacity: 0.62;
    filter: brightness(0.83);
  }

  50% {
    opacity: 1;
    filter: brightness(1.3);
  }
}


/* =========================================================
   スマートフォン調整
========================================================= */

@media (max-width: 410px) {
  body {
    padding-left: 4px;
    padding-right: 4px;
  }

  .machine-wrap {
    transform-origin: top center;
  }
}

@media (max-width: 365px) {
  .machine {
    padding-left: 29px;
    padding-right: 29px;
  }

  .stop-button {
    width: 50px;
    height: 50px;
  }

  .control-buttons {
    gap: 5px;
  }
}
</style>
</head>

<body>

<div class="machine-wrap">

  <main class="machine">

    <!-- トップクラウン -->
    <header class="top-crown">
      <div class="crown-led"></div>
    </header>


    <!-- 左サイドフレーム -->
    <aside class="side-frame left">
      <div class="side-led-column">
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
      </div>

      <div class="side-gold"></div>
    </aside>


    <!-- 右サイドフレーム -->
    <aside class="side-frame right">
      <div class="side-led-column">
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
        <span class="side-led"></span>
      </div>

      <div class="side-gold"></div>
    </aside>


    <!-- 筐体内部 -->
    <div class="machine-inner">

      <!-- タイトルパネル -->
      <section class="panel title-panel">
        <div class="title-screen"></div>
      </section>


      <!-- メイン表示 -->
      <section class="panel display-panel">
        <div class="display-screen"></div>
      </section>


      <!-- リール -->
      <section class="panel reel-panel">
        <div class="reel-window">
          <div class="reel"></div>
          <div class="reel"></div>
          <div class="reel"></div>
        </div>
      </section>


      <!-- 操作卓 -->
      <section class="control-deck">

        <div class="control-grid">

          <div class="lever-base">
            <div class="lever"></div>
          </div>

          <div class="control-buttons">
            <div class="small-button"></div>
            <div class="stop-button"></div>
            <div class="stop-button"></div>
            <div class="stop-button"></div>
          </div>

        </div>

      </section>


      <!-- 下部パネル -->
      <section class="panel lower-panel">
        <div class="lower-screen"></div>
      </section>


      <!-- ベース -->
      <footer class="machine-base"></footer>

    </div>

  </main>

</div>

</body>
</html>
