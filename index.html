<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Ver.T25 スロット試験機 | 遊創舎</title>
  <style>
    /* =============================================
       [1] リセット・基盤スタイル
    ============================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      background: #050505;
      overflow-x: hidden;
    }

    body {
      min-height: 100%;
      background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Courier New', 'Lucida Console', monospace;
      overflow-x: hidden;
    }

    /* =============================================
       [2] Canvas エフェクト オーバーレイ
    ============================================= */
    #effectCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9000;
    }

    /* =============================================
       [3] 筐体 メイン構造
    ============================================= */
    #cabinet {
      width: 390px;
      min-height: 100vh;
      position: relative;
      /* 金属の深いブラック基調 */
      background:
        linear-gradient(175deg, #1c1c1c 0%, #080808 35%, #111 65%, #1a1a1a 100%);
      /* ゴールドサイドボーダー */
      border-left:  3px solid #7a5c0a;
      border-right: 3px solid #7a5c0a;
      overflow: hidden;
      /* 深みのある外部シャドウ */
      box-shadow:
        -6px 0 20px rgba(184, 134, 11, 0.25),
         6px 0 20px rgba(184, 134, 11, 0.25),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    /* 金属ヘアライン質感オーバーレイ */
    #cabinet::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent        0px,
        transparent        3px,
        rgba(255,255,255,0.015) 3px,
        rgba(255,255,255,0.015) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* 中央縦方向の光沢ハイライト */
    #cabinet::after {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 55%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.04) 0%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    /* 筐体直下の子要素は z-index を確保 */
    #cabinet > * {
      position: relative;
      z-index: 1;
    }

    /* =============================================
       [4] 上部 LED ストリップ
    ============================================= */
    .top-led-strip {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 10px 20px 8px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    }

    .led-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .led-dot.gold {
      background: #ffd700;
      box-shadow: 0 0 5px #ffd700, 0 0 10px rgba(255,215,0,0.5);
      animation: ledPulse 1.6s ease-in-out infinite;
    }

    .led-dot.red {
      background: #ff3800;
      box-shadow: 0 0 5px #ff3800, 0 0 10px rgba(255,56,0,0.5);
      animation: ledPulse 1.6s ease-in-out infinite;
    }

    .led-dot:nth-child(1)  { animation-delay: 0.00s; }
    .led-dot:nth-child(2)  { animation-delay: 0.16s; }
    .led-dot:nth-child(3)  { animation-delay: 0.32s; }
    .led-dot:nth-child(4)  { animation-delay: 0.48s; }
    .led-dot:nth-child(5)  { animation-delay: 0.64s; }
    .led-dot:nth-child(6)  { animation-delay: 0.80s; }
    .led-dot:nth-child(7)  { animation-delay: 0.96s; }
    .led-dot:nth-child(8)  { animation-delay: 1.12s; }
    .led-dot:nth-child(9)  { animation-delay: 1.28s; }
    .led-dot:nth-child(10) { animation-delay: 1.44s; }
    .led-dot:nth-child(11) { animation-delay: 0.08s; }
    .led-dot:nth-child(12) { animation-delay: 0.24s; }
    .led-dot:nth-child(13) { animation-delay: 0.40s; }
    .led-dot:nth-child(14) { animation-delay: 0.56s; }
    .led-dot:nth-child(15) { animation-delay: 0.72s; }

    @keyframes ledPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.28; transform: scale(0.72); }
    }

    /* =============================================
       [5] マシン ヘッダー（タイトル部）
    ============================================= */
    .machine-header {
      text-align: center;
      padding: 6px 20px 10px;
      position: relative;
    }

    /* 左右の水平ライン装飾 */
    .machine-header::before,
    .machine-header::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28%;
      height: 1px;
      background: linear-gradient(to right, transparent, #8b6914 60%, #ffd700 100%);
    }
    .machine-header::before { left: 5%; }
    .machine-header::after  { right: 5%; transform: translateY(-50%) scaleX(-1); }

    .machine-name {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #ffd700;
      text-shadow:
        0 0 8px  rgba(255, 215, 0, 0.9),
        0 0 20px rgba(255, 165, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .machine-subtitle {
      font-size: 8px;
      letter-spacing: 4px;
      color: #7a5c0a;
      margin-top: 3px;
      text-transform: uppercase;
    }

    /* =============================================
       [6] リール エリア全体（サイドパネル含む）
    ============================================= */
    .reel-area {
      display: flex;
      align-items: stretch;
      padding: 0 8px;
      gap: 4px;
      margin-bottom: 8px;
    }

    /* =============================================
       [7] サイドパネル（PEKA ランプ + LED）
    ============================================= */
    .side-panel {
      width: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 0;
      flex-shrink: 0;
    }

    /* PEKA ランプ本体 */
    .peka-lamp {
      width: 14px;
      height: 28px;
      border-radius: 4px;
      background: radial-gradient(circle at 50% 40%, #1a0800 30%, #0a0400 100%);
      border: 1px solid #3a1800;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      transition: background 0.08s, box-shadow 0.08s, border-color 0.08s;
      flex-shrink: 0;
    }

    /* 点灯状態 */
    .peka-lamp.lit {
      background: radial-gradient(circle at 50% 35%, #ffffff 15%, #ffee55 50%, #ffaa00 100%);
      border-color: #ffd700;
      box-shadow:
        0 0  8px #ffe040,
        0 0 20px #ffaa00,
        0 0 40px rgba(255, 180, 0, 0.6);
      animation: pekaFlash 0.12s ease-in-out infinite alternate;
    }

    @keyframes pekaFlash {
      from {
        box-shadow:
          0 0  8px #ffe040,
          0 0 20px #ffaa00,
          0 0 40px rgba(255,180,0,0.6);
      }
      to {
        box-shadow:
          0 0 16px #ffffff,
          0 0 35px #ffe040,
          0 0 70px rgba(255,200,0,0.9);
      }
    }

    /* サイド LED ドット */
    .side-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .side-led.gold {
      background: #ffd700;
      box-shadow: 0 0 4px #ffd700, 0 0 8px rgba(255,215,0,0.4);
      animation: sideLed 2.0s ease-in-out infinite;
    }

    .side-led.amber {
      background: #ff8800;
      box-shadow: 0 0 4px #ff8800, 0 0 8px rgba(255,136,0,0.4);
      animation: sideLed 2.0s ease-in-out infinite;
    }

    /* 左右で点灯タイミングをずらす */
    .side-panel.left  .side-led:nth-child(odd)  { animation-delay: 0.0s; }
    .side-panel.left  .side-led:nth-child(even) { animation-delay: 1.0s; }
    .side-panel.right .side-led:nth-child(odd)  { animation-delay: 0.5s; }
    .side-panel.right .side-led:nth-child(even) { animation-delay: 1.5s; }

    @keyframes sideLed {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }

    /* =============================================
       [8] リール窓フレーム
    ============================================= */
    .reel-frame {
      flex: 1;
      position: relative;
      border-radius: 10px;
      /* 金属ベゼルのグラデーション */
      background: linear-gradient(145deg, #2c2c2c 0%, #0e0e0e 50%, #1e1e1e 100%);
      padding: 3px;
      /* ゴールドの外枠アウトライン */
      border: 2px solid transparent;
      outline: 1px solid #3a2a00;
      box-shadow:
        0  6px 30px rgba(0,0,0,0.9),
        0  2px  6px rgba(0,0,0,0.6),
        inset 0  1px 3px rgba(255,255,255,0.09),
        inset 0 -1px 3px rgba(0,0,0,0.6);
    }

    /* ゴールドグラデーション枠 */
    .reel-frame::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      background: linear-gradient(
        145deg,
        #c8a000 0%,
        #ffd700 30%,
        #8b6000 50%,
        #ffd700 70%,
        #c8a000 100%
      );
      z-index: -1;
    }

    /* ガラス上部反射 */
    .reel-frame::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px;
      height: 30%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.10) 0%,
        rgba(255,255,255,0.03) 70%,
        transparent 100%
      );
      border-radius: 8px 8px 0 0;
      pointer-events: none;
      z-index: 8;
    }

    /* フレーム内側 */
    .reel-frame-inner {
      background: #040404;
      border-radius: 8px;
      padding: 12px 10px;
      position: relative;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
    }

    /* 当選ライン（中段ライン） */
    /*
     * 計算: padding-top(12) + 1行目(76) + 半行(38) = 126px
     * ただし .win-line は reel-frame-inner 内 absolute なので top:126px
     */
    .win-line {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 126px;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 200, 0, 0.50) 15%,
        rgba(255, 215, 0, 0.80) 50%,
        rgba(255, 200, 0, 0.50) 85%,
        transparent
      );
      z-index: 9;
      pointer-events: none;
    }

    /* =============================================
       [9] リールコンテナ / リール窓 / テープ / 図柄
    ============================================= */
    .reel-container {
      display: flex;
      gap: 6px;
    }

    /* 個別リール窓 */
    .reel-window {
      flex: 1;
      height: 228px; /* 3 × 76px */
      overflow: hidden;
      position: relative;
      background: #020202;
      border-radius: 4px;
      border: 1px solid #222;
      box-shadow:
        inset 0 0 25px rgba(0,0,0,0.95),
        inset 0 0  6px rgba(0,0,0,1);
    }

    /* 上部マスク (グラデーション遮蔽) */
    .reel-window::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.97) 0%,
        rgba(0,0,0,0.55) 65%,
        transparent      100%
      );
      z-index: 6;
      pointer-events: none;
    }

    /* 下部マスク */
    .reel-window::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 44px;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.97) 0%,
        rgba(0,0,0,0.55) 65%,
        transparent      100%
      );
      z-index: 6;
      pointer-events: none;
    }

    /* スキャンライン（CRTガラス質感） */
    .reel-scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 5px,
        rgba(0,0,0,0.07) 5px,
        rgba(0,0,0,0.07) 6px
      );
      z-index: 5;
      pointer-events: none;
      border-radius: 4px;
    }

    /* リールテープ（無限縦スクロール用） */
    .reel-tape {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
    }

    /* シンボル共通 */
    .reel-sym {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      line-height: 1;
      user-select: none;
      position: relative;
    }

    /* ===== 各シンボル スタイル ===== */
    .sym-7 {
      font-size: 38px;
      font-weight: 900;
      color: #ff2424;
      text-shadow:
        0 0  8px rgba(255,  0,  0, 0.9),
        0 0 18px rgba(255,  0,  0, 0.5),
        0 2px 3px rgba(  0,  0,  0, 0.9);
    }

    .sym-bar {
      font-size: 17px;
      font-weight: 900;
      color: #d8d8d8;
      letter-spacing: 1px;
      text-shadow:
        0 0 5px rgba(200,200,200,0.6),
        0 1px 2px rgba(0,0,0,0.9);
      font-family: 'Arial Black', 'Arial', sans-serif;
    }

    .sym-bell {
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255,215,0,0.7);
    }

    .sym-cherry {
      filter: drop-shadow(0 0 3px rgba(255,80,80,0.5));
    }

    .sym-star {
      color: #ffe040;
      text-shadow: 0 0 8px rgba(255,220,0,0.7);
    }

    .sym-melon {
      filter: drop-shadow(0 0 3px rgba(80,200,80,0.5));
    }

    .sym-lemon {
      filter: drop-shadow(0 0 3px rgba(255,230,50,0.5));
    }

    /* 停止時フラッシュ */
    @keyframes reelStopFlash {
      0%   {
        box-shadow: inset 0 0 35px rgba(255,220,0,0.75),
                    inset 0 0  6px rgba(0,0,0,1);
        border-color: #ffd700;
      }
      100% {
        box-shadow: inset 0 0 25px rgba(0,0,0,0.95),
                    inset 0 0  6px rgba(0,0,0,1);
        border-color: #222;
      }
    }

    .reel-window.flash-stop {
      animation: reelStopFlash 0.45s ease-out forwards;
    }

    /* =============================================
       [10] 情報表示パネル（CREDIT / BET / PAYOUT）
    ============================================= */
    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2px 8px 4px;
      background: linear-gradient(to bottom, #141200 0%, #0a0900 50%, #141200 100%);
      border: 1px solid #3e3000;
      border-radius: 6px;
      padding: 8px 10px;
      box-shadow:
        0 3px 10px rgba(0,0,0,0.85),
        inset 0 1px 3px rgba(0,0,0,0.8),
        inset 0 0 30px rgba(0,0,0,0.4);
    }

    .info-item {
      text-align: center;
      flex: 1;
    }

    .info-item + .info-item {
      border-left: 1px solid #2a2000;
    }

    .info-label {
      font-size: 8px;
      letter-spacing: 2px;
      color: #6a4e00;
      margin-bottom: 4px;
    }

    /* LED数字ディスプレイ風 */
    .info-value {
      font-size: 24px;
      font-weight: 900;
      color: #ffd700;
      text-shadow:
        0 0  8px rgba(255,215,0,0.9),
        0 0 18px rgba(255,160,0,0.5);
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }

    /* 配当表示の点滅 */
    @keyframes payoutBlink {
      0%, 100% {
        color: #ffd700;
        text-shadow: 0 0 8px rgba(255,215,0,0.9), 0 0 18px rgba(255,160,0,0.5);
      }
      50% {
        color: #ffffff;
        text-shadow: 0 0 20px #ffffff, 0 0 40px #ffd700;
      }
    }

    .info-value.blink {
      animation: payoutBlink 0.38s ease-in-out infinite;
    }

    /* =============================================
       [11] 操作ボタンパネル
    ============================================= */
    .button-row {
      display: flex;
      gap: 6px;
      padding: 4px 8px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: 900;
      letter-spacing: 1px;
      position: relative;
      -webkit-appearance: none;
      user-select: none;
      touch-action: manipulation;
      /* ボタン押下 transition */
      transition: transform 0.07s ease, filter 0.07s ease;
    }

    /* ===== 押下アニメーション ===== */
    .btn:active:not(:disabled) {
      transform: translateY(3px) scale(0.97);
      filter: brightness(0.70);
    }

    /* BET ボタン */
    .btn-bet {
      height: 52px;
      font-size: 13px;
      color: #bbbbbb;
      background: linear-gradient(to bottom, #3c3c3c 0%, #242424 40%, #1c1c1c 60%, #2e2e2e 100%);
      box-shadow:
        0 4px 0 #0e0e0e,
        0 5px 8px rgba(0,0,0,0.7),
        inset 0 1px 2px rgba(255,255,255,0.10),
        inset 0 -1px 2px rgba(0,0,0,0.5);
      border-top: 1px solid #545454;
    }

    /* MAX BET ボタン */
    .btn-maxbet {
      height: 52px;
      font-size: 10px;
      color: #c0a030;
      background: linear-gradient(to bottom, #3a3820 0%, #22200c 40%, #1a1808 60%, #2c2a10 100%);
      box-shadow:
        0 4px 0 #0c0c04,
        0 5px 8px rgba(0,0,0,0.7),
        inset 0 1px 2px rgba(255,255,255,0.07),
        inset 0 -1px 2px rgba(0,0,0,0.5);
      border-top: 1px solid #4a4418;
    }

    /* START ボタン（最も目立つ） */
    .btn-start {
      height: 52px;
      font-size: 14px;
      color: #55dd55;
      background: linear-gradient(to bottom, #1c4a1c 0%, #0e2e0e 40%, #0a240a 60%, #163c16 100%);
      box-shadow:
        0 4px 0 #061806,
        0 5px 10px rgba(0,0,0,0.8),
        inset 0 1px 2px rgba(255,255,255,0.07),
        inset 0 -1px 2px rgba(0,0,0,0.5),
        0 0 12px rgba(0, 120, 0, 0.25);
      border-top: 1px solid #2a6a2a;
      text-shadow: 0 0 8px rgba(85,221,85,0.7);
    }

    /* START が押せる状態のグロー */
    .btn-start.ready {
      box-shadow:
        0 4px 0 #061806,
        0 5px 10px rgba(0,0,0,0.8),
        inset 0 1px 2px rgba(255,255,255,0.07),
        inset 0 -1px 2px rgba(0,0,0,0.5),
        0 0 25px rgba(0, 200, 0, 0.55);
      color: #88ff66;
      text-shadow: 0 0 14px rgba(136,255,102,0.9);
    }

    /* STOP ボタン群 */
    .btn-stop {
      height: 62px;
      font-size: 11px;
      line-height: 1.2;
      color: #cc5555;
      background: linear-gradient(to bottom, #3c1010 0%, #241010 40%, #1c0808 60%, #2e1010 100%);
      box-shadow:
        0 4px 0 #100404,
        0 5px 8px rgba(0,0,0,0.8),
        inset 0 1px 2px rgba(255,255,255,0.06),
        inset 0 -1px 2px rgba(0,0,0,0.5);
      border-top: 1px solid #5c1c1c;
    }

    .btn-stop .stop-num {
      display: block;
      font-size: 18px;
      margin-top: 1px;
    }

    /* 無効ボタン */
    .btn:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    .btn:disabled:active {
      transform: none;
      filter: none;
    }

    /* =============================================
       [12] 底部装飾バー
    ============================================= */
    .bottom-bar {
      margin: 10px 8px 0;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        #7a5c0a 15%,
        #ffd700 50%,
        #7a5c0a 85%,
        transparent
      );
      border-radius: 1px;
    }

    .bottom-info {
      text-align: center;
      padding: 6px 8px 14px;
      font-size: 7px;
      letter-spacing: 3px;
      color: #2e2200;
    }

    /* =============================================
       [13] 当選メッセージ オーバーレイ
    ============================================= */
    #winMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: rgba(4, 3, 0, 0.90);
      border: 3px solid #ffd700;
      border-radius: 14px;
      padding: 22px 44px;
      text-align: center;
      z-index: 5000;
      opacity: 0;
      pointer-events: none;
      box-shadow:
        0 0 50px rgba(255,215,0,0.55),
        inset 0 0 30px rgba(255,180,0,0.08);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity   0.20s ease;
    }

    #winMessage.show {
      transform: translate(-50%, -50%) scale(1);

     JavaScript
==================================================================== -->
<script>
'use strict';

/* =============================================
   [A] 定数・設定
============================================= */

const SYM_H    = 76;            // 1シンボルの高さ (px)
const VISIBLE  = 3;             // リール窓内の可視行数
const WINDOW_H = SYM_H * VISIBLE; // リール窓の高さ (228px)

// シンボル定義（7種）
const SYMBOLS = [
  { id: 'seven',  cls: 'sym-7',      text: '7'  },
  { id: 'bar',    cls: 'sym-bar',    text: 'BAR'},
  { id: 'bell',   cls: 'sym-bell',   text: '🔔' },
  { id: 'cherry', cls: 'sym-cherry', text: '🍒' },
  { id: 'star',   cls: 'sym-star',   text: '⭐' },
  { id: 'melon',  cls: 'sym-melon',  text: '🍉' },
  { id: 'lemon',  cls: 'sym-lemon',  text: '🍋' },
];

const N       = SYMBOLS.length;      // 7
const LOOP_H  = N * SYM_H;          // 532px — 1ループの高さ
const COPIES  = 8;                   // テープのコピー数
const TAPE_H  = LOOP_H * COPIES;    // 4256px — テープ総高さ

// スピン設定
const SPIN_SPEED     = 14;    // 回転速度 (px/フレーム @ 60fps)
const DECEL_ALPHA    = 0.055; // 減速係数 (指数減衰, /フレーム @ 60fps)
const DECEL_DIST     = SPIN_SPEED / DECEL_ALPHA; // ≈ 255px — 減速開始距離
const EXTRA_LOOPS    = 2;     // 停止時に追加する余分な回転数
const WRAP_THRESHOLD = LOOP_H * (COPIES - EXTRA_LOOPS - 2); // = 4 * 532 = 2128px

// 配当テーブル（中段ラインのみ判定、掛けるBET数）
const PAY_TABLE = {
  'seven-seven-seven':   { pay: 50, name: '777 JACKPOT!!' },
  'bar-bar-bar':         { pay: 20, name: 'TRIPLE BAR'    },
  'bell-bell-bell':      { pay: 15, name: 'TRIPLE BELL'   },
  'star-star-star':      { pay: 10, name: 'TRIPLE STAR'   },
  'melon-melon-melon':   { pay:  8, name: 'TRIPLE MELON'  },
  'lemon-lemon-lemon':   { pay:  5, name: 'TRIPLE LEMON'  },
  'cherry-cherry-cherry':{ pay:  5, name: 'TRIPLE CHERRY' },
  'cherry-cherry':       { pay:  2, name: 'DOUBLE CHERRY' },
  'cherry':              { pay:  1, name: 'CHERRY'        },
};

/* =============================================
   [B] ユーティリティ
============================================= */

/** 数値を指定桁数にゼロ埋めした文字列で返す */
function pad(n, len = 3) {
  return String(n).padStart(len, '0');
}

/** ease-out-cubic: t ∈ [0,1] → [0,1] */
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

/* =============================================
   [C] Reel クラス — 縦回転リール制御
============================================= */

class Reel {
  /**
   * @param {HTMLElement} tapeEl  — .reel-tape 要素
   * @param {HTMLElement} windowEl — .reel-window 要素
   */
  constructor(tapeEl, windowEl) {
    this.tape   = tapeEl;
    this.win    = windowEl;
    this.pos    = 0;          // テープのスクロール位置 (px, 増加方向)
    this.phase  = 'idle';     // idle | spinning | stopping | stopped
    this.result = null;       // 停止シンボルインデックス (0 〜 N-1)

    // 停止アニメーション用
    this.stopEnd    = 0;
    this.stopSpeed  = 0;
    this.stopFast   = false;  // true: 等速フェーズ / false: 減速フェーズ

    this.onStopped = null;    // 停止完了コールバック
  }

  /** テープ要素にシンボルを COPIES 回繰り返して埋め込む */
  buildTape() {
    const frag = document.createDocumentFragment();
    for (let c = 0; c < COPIES; c++) {
      for (let s = 0; s < N; s++) {
        const div = document.createElement('div');
        div.className = `reel-sym ${SYMBOLS[s].cls}`;
        div.textContent = SYMBOLS[s].text;
        frag.appendChild(div);
      }
    }
    this.tape.appendChild(frag);
    this._applyTransform();
  }

  /** 回転開始 */
  startSpin() {
    this.phase     = 'spinning';
    this.result    = null;
    this.onStopped = null;
  }

  /**
   * 停止要求
   * @param {number} resultIndex — 0〜N-1、中段に表示するシンボルの番号
   */
  requestStop(resultIndex) {
    if (this.phase !== 'spinning') return;
    this.result = resultIndex;

    /*
     * 停止目標位置の算出:
     *   中段にシンボル s を表示するには pos % LOOP_H == (s - 1 + N) % N * SYM_H
     *   (0-indexed の s-1 番シンボルが窓の先頭になる位置)
     */
    const targetInLoop = ((resultIndex - 1 + N) % N) * SYM_H;
    const currentMod   = this.pos % LOOP_H;

    let dist = targetInLoop - currentMod;
    if (dist <= 0) dist += LOOP_H;          // 必ず前進
    dist += LOOP_H * EXTRA_LOOPS;           // 余分な回転を追加

    this.stopEnd   = this.pos + dist;
    this.stopSpeed = SPIN_SPEED;            // 停止開始時の速度 = 回転速度
    this.stopFast  = (dist > DECEL_DIST);   // まず等速、その後減速
    this.phase     = 'stopping';
  }

  /**
   * フレーム更新
   * @param {number} dt — 経過時間 (ms)
   */
  update(dt) {
    if (this.phase === 'idle' || this.phase === 'stopped') return;

    const factor = dt / 16.667; // 60fps 基準の補正係数

    if (this.phase === 'spinning') {
      this.pos += SPIN_SPEED * factor;
      // テープ末端に近づいたらシームレスに巻き戻す
      if (this.pos > WRAP_THRESHOLD) {
        this.pos -= LOOP_H;
      }

    } else if (this.phase === 'stopping') {
      const remaining = this.stopEnd - this.pos;

      if (this.stopFast && remaining <= DECEL_DIST) {
        // 等速フェーズ終了 → 減速フェーズへ
        this.stopFast = false;
      }

      if (this.stopFast) {
        // 等速フェーズ: 回転速度を維持
        this.pos += SPIN_SPEED * factor;
      } else {
        // 減速フェーズ: 指数減衰
        this.stopSpeed *= Math.pow(1 - DECEL_ALPHA, factor);
        this.pos       += this.stopSpeed * factor;

        // 目標到達 or 速度が十分小さい → スナップ停止
        if (this.pos >= this.stopEnd || this.stopSpeed < 0.4) {
          this.pos   = this.stopEnd;
          this.phase = 'stopped';
          this._flashStop();
          if (this.onStopped) this.onStopped(this);
          this._applyTransform();
          return;
        }
      }
    }

    this._applyTransform();
  }

  /** CSS transform を適用（テープの可視位置を更新） */
  _applyTransform() {
    // TAPE_H 超えを防ぎながら滑らかに表示
    const displayPos = this.pos % TAPE_H;
    this.tape.style.transform = `translateY(-${displayPos}px)`;
  }

  /** 停止フラッシュ演出 */
  _flashStop() {
    this.win.classList.remove('flash-stop');
    // 再トリガーのため 1フレーム遅延
    requestAnimationFrame(() => {
      this.win.classList.add('flash-stop');
      this.win.addEventListener('animationend', () => {
        this.win.classList.remove('flash-stop');
      }, { once: true });
    });
  }

  /** 停止中のシンボルを返す */
  getResult() {
    return SYMBOLS[this.result];
  }
}

/* =============================================
   [D] DOM 参照
============================================= */

const creditDisplay = document.getElementById('creditDisplay');
const betDisplay    = document.getElementById('betDisplay');
const payoutDisplay = document.getElementById('payoutDisplay');
const btnBet        = document.getElementById('btnBet');
const btnMaxBet     = document.getElementById('btnMaxBet');
const btnStart      = document.getElementById('btnStart');
const btnStops      = [
  document.getElementById('btnStop0'),
  document.getElementById('btnStop1'),
  document.getElementById('btnStop2'),
];
const pekaLamp   = document.getElementById('pekaLamp');
const winMessage = document.getElementById('winMessage');
const wmAmount   = document.getElementById('wmAmount');
const wmName     = document.getElementById('wmName');
const cabinet    = document.getElementById('cabinet');

/* =============================================
   [E] リール インスタンス生成 / 初期化
============================================= */

const reels = [
  new Reel(document.getElementById('tape0'), document.getElementById('rw0')),
  new Reel(document.getElementById('tape1'), document.getElementById('rw1')),
  new Reel(document.getElementById('tape2'), document.getElementById('rw2')),
];

// テープ構築 & 初期位置をずらして視覚的変化をつける
reels.forEach((reel, i) => {
  reel.buildTape();
  reel.pos = i * Math.floor(LOOP_H / 3); // 0 / 177 / 354 px
  reel._applyTransform();
});

/* =============================================
   [F] ゲームステート
============================================= */

const game = {
  credit:       50,
  bet:          0,
  payout:       0,
  phase:        'idle',   // idle | spinning | result
  stoppedCount: 0,
};

let autoStopTimer = null; // 自動停止タイマー

/* =============================================
   [G] 表示更新
============================================= */

function updateDisplay() {
  creditDisplay.textContent = pad(game.credit);
  betDisplay.textContent    = String(game.bet);
  payoutDisplay.textContent = pad(game.payout);

  // START ボタンのグロー制御
  if (game.bet > 0 && game.phase === 'idle') {
    btnStart.classList.add('ready');
  } else {
    btnStart.classList.remove('ready');
  }
}

/* =============================================
   [H] ゲームロジック
============================================= */

function onBet() {
  if (game.phase !== 'idle') return;
  if (game.credit <= 0) return;
  if (game.bet >= 3) return;
  game.bet++;
  game.credit--;
  updateDisplay();
}

function onMaxBet() {
  if (game.phase !== 'idle') return;
  const need   = Math.min(3 - game.bet, game.credit);
  if (need <= 0) return;
  game.bet    += need;
  game.credit -= need;
  updateDisplay();
}

function onStart() {
  if (game.phase !== 'idle') return;
  if (game.bet <= 0) {
    // BET が 0 のときにボタンを軽くフラッシュ
    btnBet.style.filter = 'brightness(2)';
    setTimeout(() => { btnBet.style.filter = ''; }, 280);
    return;
  }

  game.phase        = 'spinning';
  game.payout       = 0;
  game.stoppedCount = 0;
  updateDisplay();

  // ボタン状態切替
  btnBet.disabled    = true;
  btnMaxBet.disabled = true;
  btnStart.disabled  = true;
  btnStops.forEach(b => { b.disabled = false; });

  // リール回転開始
  reels.forEach(r => r.startSpin());

  // Canvas 演出: スタートパーティクル
  const rect = cabinet.getBoundingClientRect();
  triggerParticles(rect.left + rect.width / 2, rect.top + rect.height * 0.38, 18);

  // 自動停止（10秒後）
  autoStopTimer = setTimeout(() => {
    btnStops.forEach((btn, i) => {
      if (!btn.disabled) onStop(i);
    });
  }, 10000);
}

function onStop(reelIndex) {
  const reel = reels[reelIndex];
  if (reel.phase !== 'spinning') return;

  btnStops[reelIndex].disabled = true;

  const resultIndex = Math.floor(Math.random() * N);
  reel.requestStop(resultIndex);

  reel.onStopped = function () {
    // 停止火花演出
    const wRect = reel.win.getBoundingClientRect();
    triggerSparks(wRect.left + wRect.width / 2, wRect.top + wRect.height / 2, 10);

    game.stoppedCount++;
    if (game.stoppedCount === 3) {
      onAllStopped();
    }
  };
}

function onAllStopped() {
  // 自動停止タイマーをクリア
  if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }

  game.phase = 'result';

  const r0 = reels[0].getResult();
  const r1 = reels[1].getResult();
  const r2 = reels[2].getResult();

  const key3  = `${r0.id}-${r1.id}-${r2.id}`;
  const key2  = `${r0.id}-${r1.id}`;
  const key1  = r0.id;

  const win =
    PAY_TABLE[key3]                                         ||
    (key2 === 'cherry-cherry' ? PAY_TABLE['cherry-cherry'] : null) ||
    (key1 === 'cherry'        ? PAY_TABLE['cherry']        : null);

  if (win) {
    const total = win.pay * game.bet;
    game.payout  = total;
    game.credit += total;
    updateDisplay();
    showWin(win, total);
  } else {
    setTimeout(resetRound, 600);
  }
}

function showWin(win, amount) {
  wmAmount.textContent = amount;
  wmName.textContent   = win.name;
  winMessage.classList.add('show');

  // PEKA 点灯
  pekaLamp.classList.add('lit');

  // 筐体フラッシュ
  cabinet.classList.remove('cabinet-flash');
  requestAnimationFrame(() => {
    cabinet.classList.add('cabinet-flash');
    cabinet.addEventListener('animationend', () => {
      cabinet.classList.remove('cabinet-flash');
    }, { once: true });
  });

  // Canvas 大当たり演出
  const rect = cabinet.getBoundingClientRect();
  triggerWinEffect(rect);

  // 3秒後にリセット
  setTimeout(() => {
    winMessage.classList.remove('show');
    pekaLamp.classList.remove('lit');
    payoutDisplay.classList.remove('blink');
    resetRound();
  }, 3200);

  // PAYOUT 点滅
  payoutDisplay.classList.add('blink');
}

function resetRound() {
  if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
  game.phase  = 'idle';
  game.bet    = 0;

  btnBet.disabled    = false;
  btnMaxBet.disabled = false;
  btnStart.disabled  = false;
  btnStops.forEach(b => { b.disabled = true; });

  // クレジット切れ → 自動補充
  if (game.credit <= 0) {
    game.credit = 50;
  }

  updateDisplay();
}

/* =============================================
   [I] ボタンイベント登録
============================================= */

function addAction(btn, handler) {
  btn.addEventListener('click', handler);
  btn.addEventListener('touchend', e => { e.preventDefault(); handler(); });
}

addAction(btnBet,    onBet);
addAction(btnMaxBet, onMaxBet);
addAction(btnStart,  onStart);
btnStops.forEach((btn, i) => addAction(btn, () => onStop(i)));

/* =============================================
   [J] LED 装飾の初期化
============================================= */

function buildTopLED() {
  const strip   = document.getElementById('topLedStrip');
  const pattern = ['gold','gold','red','gold','gold','red','gold','gold','red',
                   'gold','gold','red','gold','gold','gold'];
  pattern.forEach(color => {
    const d = document.createElement('div');
    d.className = `led-dot ${color}`;
    strip.appendChild(d);
  });
}

function buildSideLEDs(panelId) {
  const panel   = document.getElementById(panelId);
  const pattern = ['gold','amber','gold','amber','gold','amber'];
  pattern.forEach(color => {
    const d = document.createElement('div');
    d.className = `side-led ${color}`;
    panel.appendChild(d);
  });
}

buildTopLED();
buildSideLEDs('leftPanel');
buildSideLEDs('rightPanel');

/* =============================================
   [K] Canvas エフェクトシステム（火花・粒子・雷）
============================================= */

const canvas = document.getElementById('effectCanvas');
const ctx    = canvas.getContext('2d');

// キャンバスサイズをウィンドウに合わせる
(function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  });
})();

// エフェクト格納配列
const sparks     = [];
const particles  = [];
const lightnings = [];

/* ----- Spark（火花） ----- */
class Spark {
  constructor(x, y) {
    this.x    = x;
    this.y    = y;
    this.vx   = (Math.random() - 0.5) * 9;
    this.vy   = -(Math.random() * 5.5 + 2);
    this.life = 1;
    this.fade = 0.035 + Math.random() * 0.04;
    this.size = 1.5 + Math.random() * 2.0;
    const h   = 28 + Math.random() * 32; // オレンジ〜イエロー
    this.col  = `hsl(${h},100%,65%)`;
  }
  update() {
    this.vy += 0.22;      // 重力
    this.x  += this.vx;
    this.y  += this.vy;
    this.vx *= 0.96;
    this.life -= this.fade;
  }
  draw(c) {
    if (this.life <= 0) return;
    c.save();
    c.globalAlpha = Math.max(0, this.life);
    c.fillStyle   = this.col;
    c.beginPath();
    c.arc(this.x, this.y, Math.max(0.1, this.size * this.life), 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

/* ----- Particle（輝く粒子） ----- */
class Particle {
  constructor(x, y, col) {
    this.x    = x;
    this.y    = y;
    this.vx   = (Math.random() - 0.5) * 5;
    this.vy   = (Math.random() - 0.5) * 5 - 1.5;
    this.life = 1;
    this.fade = 0.009 + Math.random() * 0.014;
    this.size = 5  + Math.random() * 9;
    this.col  = col || `hsl(${Math.random() * 55 + 20},100%,70%)`;
  }
  update() {
    this.x    += this.vx;
    this.y    += this.vy;
    this.vy   -= 0.04;    // 緩やかに上昇
    this.vx   *= 0.99;
    this.size *= 0.993;
    this.life -= this.fade;
  }
  draw(c) {
    if (this.life <= 0 || this.size < 0.5) return;
    c.save();
    c.globalAlpha = Math.max(0, this.life * 0.72);
    const g = c.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    g.addColorStop(0, this.col);
    g.addColorStop(1, 'transparent');
    c.fillStyle = g;
    c.beginPath();
    c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

/* ----- Lightning（簡易雷） ----- */
class Lightning {
  constructor(x1, y1, x2, y2) {
    this.x1   = x1; this.y1 = y1;
    this.x2   = x2; this.y2 = y2;
    this.life = 1;
    this.fade = 0.08;
    this.pts  = this._gen();
  }
  _gen() {
    const pts   = [{ x: this.x1, y: this.y1 }];
    const steps = 8 + Math.floor(Math.random() * 5);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      pts.push({
        x: this.x1 + (this.x2 - this.x1) * t + (Math.random() - 0.5) * 45,
        y: this.y1 + (this.y2 - this.y1) * t + (Math.random() - 0.5) * 45,
      });
    }
    pts.push({ x: this.x2, y: this.y2 });
    return pts;
  }
  update() { this.life -= this.fade; }
  draw(c) {
    if (this.life <= 0) return;
    c.save();

    // アウターグロー
    c.globalAlpha = this.life * 0.45;
    c.strokeStyle = 'rgba(140,190,255,1)';
    c.lineWidth   = 4;
    c.shadowColor = '#88aaff';
    c.shadowBlur  = 22;
    c.beginPath();
    this.pts.forEach((p, i) => (i === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y)));
    c.stroke();

    // コアライン（白）
    c.globalAlpha = this.life;
    c.strokeStyle = '#ffffff';
    c.lineWidth   = 1;
    c.shadowBlur  = 6;
    c.stroke();

    c.restore();
  }
}

/* ===== トリガー関数 ===== */

function triggerSparks(x, y, count = 14) {
  for (let i = 0; i < count; i++) sparks.push(new Spark(x, y));
}

function triggerParticles(x, y, count = 20) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(
      x + (Math.random() - 0.5) * 180,
      y + (Math.random() - 0.5) * 80
    ));
  }
}

function triggerLightning(rect) {
  const x1 = rect.left + Math.random() * rect.width;
  const y1 = rect.top  + Math.random() * rect.height * 0.25;
  const x2 = rect.left + Math.random() * rect.width;
  const y2 = rect.top  + rect.height  * (0.35 + Math.random() * 0.3);
  lightnings.push(new Lightning(x1, y1, x2, y2));
}

function triggerWinEffect(rect) {
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height * 0.38;

  // 大量の火花
  for (let i = 0; i < 36; i++) {
    sparks.push(new Spark(
      cx + (Math.random() - 0.5) * rect.width  * 0.75,
      cy + (Math.random() - 0.5) * 60
    ));
  }
  // 輝く粒子
  for (let i = 0; i < 28; i++) {
    particles.push(new Particle(
      cx + (Math.random() - 0.5) * rect.width * 0.8,
      cy + (Math.random() - 0.5) * 80,
      `hsl(${Math.random() * 55 + 20},100%,72%)`
    ));
  }
  // 雷を時間差で複数発生
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      triggerLightning(rect);
      triggerLightning(rect);
    }, i * 220);
  }
}

/* ===== Canvas 描画ループ ===== */
function drawEffects() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length  - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let i = sparks.length     - 1; i >= 0; i--) {
    sparks[i].update();
    sparks[i].draw(ctx);
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }
  for (let i = lightnings.length - 1; i >= 0; i--) {
    lightnings[i].update();
    lightnings[i].draw(ctx);
    if (lightnings[i].life <= 0) lightnings.splice(i, 1);
  }
}

/* =============================================
   [L] メインループ
============================================= */

let lastTime = performance.now();

function mainLoop(timestamp) {
  // dt: 経過時間 (ms)。最大 50ms でスパイク防止
  const dt   = Math.min(timestamp - lastTime, 50);
  lastTime   = timestamp;

  // リール更新
  reels.forEach(r => r.update(dt));

  // Canvas エフェクト描画
  drawEffects();

  requestAnimationFrame(mainLoop);
}

/* =============================================
   [M] 起動
============================================= */

updateDisplay();
requestAnimationFrame(mainLoop);

</script>
